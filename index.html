<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spik - Naskah & Live Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS Khusus Mode Tata Bahasa */
        .grammar-active .tag-subject { color: #2563eb; font-weight: 700; cursor: help; border-bottom: 2px dotted #2563eb; transition: all 0.2s; }
        .grammar-active .tag-verb { color: #dc2626; font-weight: 700; cursor: help; border-bottom: 2px dotted #dc2626; transition: all 0.2s; }
        .dark .grammar-active .tag-subject { color: #60a5fa; border-bottom-color: #60a5fa; }
        .dark .grammar-active .tag-verb { color: #f87171; border-bottom-color: #f87171; }

        /* CSS Khusus Terjemahan (Makna Gandul Style) */
        rt.arti-indo {
            display: none; /* Sembunyi secara default */
        }
        .translate-active rt.arti-indo {
            display: ruby-text;
            font-size: 0.75rem;
            color: #059669; /* Emerald 600 */
            font-family: sans-serif;
            font-weight: 700;
        }
        .dark .translate-active rt.arti-indo {
            color: #34d399; /* Emerald 400 */
        }
        /* Menambahkan jarak antar baris saat terjemahan aktif agar tidak bertumpuk */
        .translate-active #document-content {
            line-height: 2.5; 
        }

        @media print {
            body { background-color: white !important; }
            header, #control-panel, .print-hidden, footer { display: none !important; }
            #paper-workspace {
                box-shadow: none !important; margin: 0 !important; padding: 0 !important;
                max-width: 100% !important; background-color: transparent !important;
            }
            .phonetic-input { border: none !important; color: #4b5563 !important; }
            .grammar-active .tag-subject { color: #2563eb !important; border-bottom: none !important;}
            .grammar-active .tag-verb { color: #dc2626 !important; border-bottom: none !important;}
            .translate-active rt.arti-indo { color: #059669 !important; }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 dark:bg-gray-900 dark:text-gray-200 transition-colors duration-300 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-white dark:bg-gray-800 shadow-md p-4 sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-2xl font-black text-primary tracking-tighter"><i class="fa-solid fa-microphone-lines mr-2"></i>SPIK <span class="text-sm font-normal text-gray-500 dark:text-gray-400">Studio</span></h1>
        <button id="theme-toggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition">
            <i id="theme-icon" class="fa-solid fa-moon"></i>
        </button>
    </header>

    <!-- Main Content -->
    <main class="flex-grow w-full max-w-4xl mx-auto p-4 flex flex-col gap-6 mt-4">
        
        <!-- Panel Kontrol Input -->
        <div id="control-panel" class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
            <div class="flex justify-between items-center mb-2">
                <label class="block text-sm font-semibold dark:text-gray-300">
                    <i class="fa-solid fa-file-lines mr-2"></i>Teks Naskah / Hasil Dengar:
                </label>
                <span id="mic-status" class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-500">
                    Mic Siap
                </span>
            </div>

            <textarea id="inputText" rows="4" class="w-full p-4 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-2 focus:ring-primary outline-none transition resize-y" placeholder="Ketik/paste naskah, atau aktifkan 'Dengar Percakapan' untuk mendengarkan lawan bicara..."></textarea>
            
            <div class="flex flex-wrap gap-3 mt-4">
                <button id="btn-mic" onclick="toggleListening()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg shadow transition font-medium flex items-center text-sm">
                    <i id="mic-icon" class="fa-solid fa-microphone mr-2"></i> <span id="mic-text">Dengar Teman (Mic ON)</span>
                </button>

                <button onclick="processText()" class="bg-primary text-white px-4 py-2 rounded-lg shadow hover:bg-blue-600 transition font-medium flex items-center text-sm">
                    <i class="fa-solid fa-wand-magic-sparkles mr-2"></i> Buat Naskah
                </button>
                
                <button id="btn-grammar" onclick="toggleGrammar()" class="bg-purple-600 text-white px-4 py-2 rounded-lg shadow hover:bg-purple-700 transition font-medium flex items-center text-sm">
                    <i id="grammar-icon" class="fa-solid fa-eye mr-2"></i> <span id="grammar-text">Warna Pola (ON)</span>
                </button>

                <!-- Tombol Baru: Saklar Terjemahan -->
                <button id="btn-translate" onclick="toggleTranslate()" class="bg-gray-500 text-white px-4 py-2 rounded-lg shadow hover:bg-gray-600 transition font-medium flex items-center text-sm">
                    <i id="translate-icon" class="fa-solid fa-language mr-2"></i> <span id="translate-text">Terjemah (OFF)</span>
                </button>

                <button onclick="window.print()" class="bg-green-600 text-white px-4 py-2 rounded-lg shadow hover:bg-green-700 transition font-medium flex items-center text-sm">
                    <i class="fa-solid fa-file-pdf mr-2"></i> Cetak PDF
                </button>
            </div>
        </div>

        <!-- Area Kerja Kertas -->
        <div class="overflow-x-auto pb-8">
            <!-- Container Kertas -->
            <div id="paper-workspace" class="grammar-active bg-white text-gray-900 mx-auto p-10 md:p-16 shadow-lg rounded-sm w-full max-w-[21cm] min-h-[29.7cm] border border-gray-300 dark:border-none transition-none relative">
                
                <div class="text-center mb-8 border-b-2 border-gray-800 pb-4 print-hidden">
                    <h2 class="text-3xl font-serif font-bold text-gray-300">AREA KERTAS NASKAH</h2>
                    <p class="text-sm text-gray-400 mt-2">Naskah atau suara yang didengar akan muncul di sini.</p>
                </div>

                <div id="color-legend" class="hidden mb-6 bg-blue-50 p-3 rounded text-sm print-hidden border border-blue-100 flex flex-wrap gap-4 justify-between items-center">
                    <div>
                        <strong>Petunjuk Warna:</strong> 
                        <span class="text-blue-600 font-bold ml-2">Biru = Subjek</span> | 
                        <span class="text-red-600 font-bold">Merah = Kata Kerja</span>
                    </div>
                    <div class="text-emerald-600 font-bold">
                        <i class="fa-solid fa-language"></i> Teks Hijau = Arti Kata
                    </div>
                </div>

                <div id="document-content" class="space-y-8 font-serif text-xl leading-relaxed">
                    <!-- Teks naskah di-render ke sini -->
                </div>

            </div>
        </div>

    </main>

    <script>
        // --- KAMUS BISPIK (Ditambah 'i' untuk arti Indonesia) ---
        const spikDictionary = {
            // Pronouns (Kata Ganti)
            "i": { p: "ai", c: "subject", i: "saya" }, "you": { p: "yu", c: "subject", i: "kamu" }, 
            "they": { p: "dei", c: "subject", i: "mereka" }, "we": { p: "wi", c: "subject", i: "kami" }, 
            "he": { p: "hi", c: "subject", i: "dia(L)" }, "she": { p: "syi", c: "subject", i: "dia(P)" }, 
            "it": { p: "it", c: "subject", i: "itu" },
            
            // To Be & Bantuan
            "am": { p: "em", c: "verb", i: "adalah" }, "is": { p: "is", c: "verb", i: "adalah" }, "are": { p: "ar", c: "verb", i: "adalah" },
            "do": { p: "du", c: "verb", i: "melakukan" }, "did": { p: "did", c: "verb", i: "telah melakukan" },
            "have": { p: "hev", c: "verb", i: "memiliki" }, "has": { p: "hes", c: "verb", i: "memiliki" },
            
            // Kosa kata dari gambar Naskah Khotbah Anda
            "the": { p: "de", c: "", i: "" }, // Artikel the biasanya tidak diterjemahkan agar luwes
            "purity": { p: "pyuriti", c: "", i: "kesucian" },
            "all": { p: "ol", c: "", i: "segala" },
            "praise": { p: "preis", c: "", i: "pujian" },
            "for": { p: "for", c: "", i: "untuk" },
            "allah": { p: "allah", c: "subject", i: "Allah" },
            "him": { p: "him", c: "", i: "Dia" },
            "seek": { p: "sik", c: "verb", i: "mencari" },
            "his": { p: "his", c: "", i: "-Nya" },
            "aid": { p: "eid", c: "", i: "bantuan" },
            "and": { p: "en", c: "", i: "dan" },
            "ask": { p: "ask", c: "verb", i: "meminta" },
            "forgiveness": { p: "forgivnes", c: "", i: "ampunan" },
            "testify": { p: "testifai", c: "verb", i: "bersaksi" },
            "that": { p: "det", c: "", i: "bahwa" },
            "none": { p: "nan", c: "subject", i: "tiada" },
            "right": { p: "rait", c: "", i: "hak" },
            "to": { p: "tu", c: "", i: "untuk" },
            "be": { p: "bi", c: "verb", i: "menjadi" },
            "worshipped": { p: "worsyipt", c: "verb", i: "disembah" },
            "except": { p: "eksept", c: "", i: "kecuali" }
        };

        // --- SAKLAR TATA BAHASA ---
        let isGrammarActive = true;
        function toggleGrammar() {
            isGrammarActive = !isGrammarActive;
            const workspace = document.getElementById('paper-workspace');
            const btn = document.getElementById('btn-grammar');
            const icon = document.getElementById('grammar-icon');
            const text = document.getElementById('grammar-text');
            
            if (isGrammarActive) {
                workspace.classList.add('grammar-active');
                icon.className = "fa-solid fa-eye mr-2";
                text.innerText = "Warna Pola (ON)";
                btn.classList.replace('bg-gray-500', 'bg-purple-600');
                btn.classList.replace('hover:bg-gray-600', 'hover:bg-purple-700');
            } else {
                workspace.classList.remove('grammar-active');
                icon.className = "fa-solid fa-eye-slash mr-2";
                text.innerText = "Warna Pola (OFF)";
                btn.classList.replace('bg-purple-600', 'bg-gray-500');
                btn.classList.replace('hover:bg-purple-700', 'hover:bg-gray-600');
            }
        }

        // --- SAKLAR TERJEMAHAN (BARU) ---
        let isTranslateActive = false;
        function toggleTranslate() {
            isTranslateActive = !isTranslateActive;
            const workspace = document.getElementById('paper-workspace');
            const btn = document.getElementById('btn-translate');
            const icon = document.getElementById('translate-icon');
            const text = document.getElementById('translate-text');

            if (isTranslateActive) {
                workspace.classList.add('translate-active');
                text.innerText = "Terjemah (ON)";
                btn.classList.replace('bg-gray-500', 'bg-teal-600');
                btn.classList.replace('hover:bg-gray-600', 'hover:bg-teal-700');
            } else {
                workspace.classList.remove('translate-active');
                text.innerText = "Terjemah (OFF)";
                btn.classList.replace('bg-teal-600', 'bg-gray-500');
                btn.classList.replace('hover:bg-teal-700', 'hover:bg-gray-600');
            }
        }

        // --- FITUR SPEECH-TO-TEXT ---
        let recognition = null;
        let isListening = false;
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                let currentSpeech = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    currentSpeech += event.results[i][0].transcript;
                }
                const textArea = document.getElementById('inputText');
                if (textArea.value.trim() === '') {
                    textArea.value = currentSpeech.trim();
                } else {
                    textArea.value += '\n' + currentSpeech.trim();
                }
                processText();
            };
            recognition.onend = () => { if (isListening) recognition.start(); };
        }

        function toggleListening() {
            if (!recognition) return alert("Gunakan Chrome/Edge untuk fitur ini.");
            if (!isListening) startListening(); else stopListening();
        }

        function startListening() {
            isListening = true; recognition.start();
            const btn = document.getElementById('btn-mic');
            btn.className = "bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg shadow transition font-medium flex items-center text-sm animate-pulse";
            document.getElementById('mic-text').innerText = "Mendengarkan... (STOP)";
            document.getElementById('mic-icon').className = "fa-solid fa-circle-stop mr-2";
            document.getElementById('mic-status').className = "text-xs font-semibold px-2.5 py-0.5 rounded-full bg-red-100 text-red-700";
            document.getElementById('mic-status').innerText = "Mic AKTIF";
        }

        function stopListening() {
            isListening = false; if (recognition) recognition.stop();
            const btn = document.getElementById('btn-mic');
            btn.className = "bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg shadow transition font-medium flex items-center text-sm";
            document.getElementById('mic-text').innerText = "Dengar Teman (Mic ON)";
            document.getElementById('mic-icon').className = "fa-solid fa-microphone mr-2";
            document.getElementById('mic-status').className = "text-xs font-semibold px-2.5 py-0.5 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-500";
            document.getElementById('mic-status').innerText = "Mic Siap";
        }

        // --- PEMROSESAN TEKS & KERTAS ---
        function processText() {
            const rawText = document.getElementById('inputText').value;
            const docContent = document.getElementById('document-content');
            const colorLegend = document.getElementById('color-legend');
            
            docContent.innerHTML = '';

            if(!rawText.trim()) {
                docContent.innerHTML = '<p class="text-center text-gray-400 italic">Silakan masukkan teks atau gunakan tombol Dengar.</p>';
                colorLegend.classList.add('hidden');
                return;
            }

            colorLegend.classList.remove('hidden');

            const paragraphs = rawText.split('\n').filter(p => p.trim() !== '');

            paragraphs.forEach((para) => {
                const block = document.createElement('div');
                block.className = "relative group";
                
                const safeTextToSpeak = para.replace(/'/g, "\\'");
                const rawWords = para.split(/\s+/);
                let displayHTMLWords = [];
                let phoneticWords = [];

                rawWords.forEach(rawWord => {
                    const cleanWord = rawWord.replace(/[.,?!;:()\[\]]/g, "").toLowerCase();
                    const dictionaryEntry = spikDictionary[cleanWord];

                    if (dictionaryEntry) {
                        phoneticWords.push(dictionaryEntry.p);
                        let formattedWord = rawWord;
                        
                        // Tag Grammar
                        if (dictionaryEntry.c === "subject") {
                            formattedWord = `<span class="tag-subject" title="Subjek">${rawWord}</span>`;
                        } else if (dictionaryEntry.c === "verb") {
                            formattedWord = `<span class="tag-verb" title="Kata Kerja">${rawWord}</span>`;
                        }

                        // Menggunakan Tag <ruby> HTML5 untuk Efek Makna Gandul
                        if (dictionaryEntry.i && dictionaryEntry.i !== "") {
                            formattedWord = `<ruby>${formattedWord}<rt class="arti-indo">${dictionaryEntry.i}</rt></ruby>`;
                        }
                        
                        displayHTMLWords.push(formattedWord);
                    } else {
                        phoneticWords.push(cleanWord);
                        displayHTMLWords.push(rawWord);
                    }
                });

                const finalDisplayHTML = displayHTMLWords.join(" ");
                const finalPhoneticText = "/ " + phoneticWords.join(" ") + " /";

                block.innerHTML = `
                    <div class="pr-12">
                        <p class="text-xl mb-4 text-justify text-gray-900">${finalDisplayHTML}</p>
                        <input type="text" value="${finalPhoneticText}" class="phonetic-input w-full text-blue-600 font-mono text-lg bg-transparent border-b border-dashed border-gray-400 focus:outline-none focus:border-blue-500 placeholder-gray-300">
                    </div>
                    <button onclick="playAudio('${safeTextToSpeak}')" class="print-hidden absolute top-0 right-0 w-10 h-10 bg-gray-100 hover:bg-primary hover:text-white rounded-full flex items-center justify-center text-gray-500 transition shadow-sm border border-gray-200 mt-2">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                `;
                docContent.appendChild(block);
            });

            const paperHeader = document.querySelector('#paper-workspace .print-hidden.border-b-2');
            if(paperHeader) paperHeader.style.display = 'none';
        }

        function playAudio(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.85; 
                window.speechSynthesis.speak(utterance);
            }
        }

        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const htmlElement = document.documentElement;
        themeToggleBtn.addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            themeIcon.className = htmlElement.classList.contains('dark') ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        });
    </script>
</body>
</html>
