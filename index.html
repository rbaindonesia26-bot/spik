<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spik - Naskah Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @media print {
            body { background-color: white !important; }
            header, #control-panel, .print-hidden, footer { display: none !important; }
            #paper-workspace {
                box-shadow: none !important;
                margin: 0 !important;
                padding: 0 !important;
                max-width: 100% !important;
                background-color: transparent !important;
            }
            .phonetic-input { border: none !important; color: #4b5563 !important; }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 dark:bg-gray-900 dark:text-gray-200 transition-colors duration-300 min-h-screen flex flex-col font-sans">

    <header class="bg-white dark:bg-gray-800 shadow-md p-4 sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-2xl font-black text-primary tracking-tighter"><i class="fa-solid fa-microphone-lines mr-2"></i>SPIK <span class="text-sm font-normal text-gray-500 dark:text-gray-400">Studio</span></h1>
        <button id="theme-toggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition">
            <i id="theme-icon" class="fa-solid fa-moon"></i>
        </button>
    </header>

    <main class="flex-grow w-full max-w-4xl mx-auto p-4 flex flex-col gap-6 mt-4">
        
        <div id="control-panel" class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
            <label class="block text-sm font-semibold mb-2 dark:text-gray-300"><i class="fa-solid fa-paste mr-2"></i>Paste Naskah Bahasa Inggris di sini:</label>
            <textarea id="inputText" rows="5" class="w-full p-4 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-2 focus:ring-primary outline-none transition resize-y" placeholder="Contoh: Ladies and gentlemen, it is an honor to stand before you today..."></textarea>
            
            <div class="flex flex-wrap gap-3 mt-4">
                <button onclick="processText()" class="bg-primary text-white px-5 py-2.5 rounded-lg shadow hover:bg-blue-600 transition font-medium flex items-center">
                    <i class="fa-solid fa-wand-magic-sparkles mr-2"></i> Buat Kertas Naskah
                </button>
                <button onclick="window.print()" class="bg-green-600 text-white px-5 py-2.5 rounded-lg shadow hover:bg-green-700 transition font-medium flex items-center">
                    <i class="fa-solid fa-file-pdf mr-2"></i> Cetak / Simpan PDF
                </button>
            </div>
        </div>

        <div class="overflow-x-auto pb-8">
            <div id="paper-workspace" class="bg-white text-gray-900 mx-auto p-10 md:p-16 shadow-lg rounded-sm w-full max-w-[21cm] min-h-[29.7cm] border border-gray-300 dark:border-none transition-none relative">
                
                <div class="text-center mb-8 border-b-2 border-gray-800 pb-4 print-hidden">
                    <h2 class="text-3xl font-serif font-bold text-gray-300">AREA KERTAS NASKAH</h2>
                    <p class="text-sm text-gray-400 mt-2">Naskah Anda akan muncul di sini.</p>
                </div>

                <div id="document-content" class="space-y-8 font-serif text-lg leading-relaxed">
                    <!-- Teks naskah akan di-render ke sini -->
                </div>

            </div>
        </div>

    </main>

    <footer class="text-center p-4 text-sm text-gray-500 dark:text-gray-400 mt-auto font-medium print-hidden">
        &copy; 2026 Spik. Baca Inggris Tanpa Meringis.
    </footer>

    <script>
        // --- KAMUS BISPIK (Database Internal) ---
        // Anda bisa terus menambahkan kata baru di sini tanpa batas!
        const spikDictionary = {
            "all": "ol", "praise": "preis", "is": "is", "due": "du", "to": "tu",
            "allah": "allah", "we": "wi", "him": "him", "seek": "sik", "for": "for",
            "his": "his", "assistance": "asistens", "and": "en", "forgiveness": "forgivnes",
            "refuge": "refyuj", "with": "wid", "from": "from", "evils": "ivels",
            "of": "ov", "our": "aur", "souls": "souls", "misdeeds": "misdids",
            "no": "no", "one": "wan", "can": "ken", "mislead": "mislid",
            "whosoever": "husoeber", "guides": "gaids", "none": "nan", "guide": "gaid",
            "causes": "koses", "go": "go", "astray": "astrei",
            "i": "ai", "want": "won", "learn": "lern", "how": "hau", "speak": "spik",
            "english": "ingglis", "naturally": "necereli", "the": "de", "weather": "weder",
            "rough": "raf", "will": "wil", "walk": "wok", "through": "thru", "it": "it"
        };

        // Fungsi menerjemahkan teks ke fonetik
        function translateToPhonetic(text) {
            // Hilangkan tanda baca untuk pencarian di kamus
            const cleanText = text.replace(/[.,?!;:()]/g, "").toLowerCase();
            const words = cleanText.split(/\s+/);
            
            const translatedWords = words.map(word => {
                // Jika kata ada di kamus, gunakan terjemahannya. Jika tidak, biarkan kata aslinya (atau beri tanda)
                return spikDictionary[word] ? spikDictionary[word] : word;
            });

            return "/ " + translatedWords.join(" ") + " /";
        }

        function processText() {
            const rawText = document.getElementById('inputText').value;
            const docContent = document.getElementById('document-content');
            
            docContent.innerHTML = '';

            if(!rawText.trim()) {
                docContent.innerHTML = '<p class="text-center text-gray-400 italic">Silakan masukkan teks terlebih dahulu.</p>';
                return;
            }

            const paragraphs = rawText.split('\n').filter(p => p.trim() !== '');

            paragraphs.forEach((para, index) => {
                const block = document.createElement('div');
                block.className = "relative group";
                
                const safeText = para.replace(/'/g, "\\'");
                
                // Terjemahkan paragraf secara otomatis
                const phoneticText = translateToPhonetic(para);

                block.innerHTML = `
                    <div class="pr-12">
                        <p class="text-xl font-bold mb-2 text-justify">${para}</p>
                        <!-- Input otomatis terisi dari hasil terjemahan -->
                        <input type="text" value="${phoneticText}" class="phonetic-input w-full text-blue-600 font-mono text-lg bg-transparent border-b border-dashed border-gray-400 focus:outline-none focus:border-blue-500 placeholder-gray-300">
                    </div>
                    <button onclick="playAudio('${safeText}')" class="print-hidden absolute top-0 right-0 w-10 h-10 bg-gray-100 hover:bg-primary hover:text-white rounded-full flex items-center justify-center text-gray-500 transition shadow-sm border border-gray-200">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                `;
                docContent.appendChild(block);
            });

            const paperHeader = document.querySelector('#paper-workspace .print-hidden.border-b-2');
            if(paperHeader) paperHeader.style.display = 'none';
        }

        function playAudio(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.85; 
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Maaf, browser Anda tidak mendukung fitur suara.");
            }
        }

        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const htmlElement = document.documentElement;

        themeToggleBtn.addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            if (htmlElement.classList.contains('dark')) {
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
            } else {
                themeIcon.classList.remove('fa-sun');
                themeIcon.classList.add('fa-moon');
            }
        });
    </script>
</body>
</html>
