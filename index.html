<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spik - English Phonetic Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        subject: '#2563eb', /* Biru untuk Subjek */
                        verb: '#dc2626',    /* Merah untuk Kata Kerja */
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-200 transition-colors duration-300 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white dark:bg-gray-800 shadow-md p-4 sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-2xl font-black text-primary tracking-tighter"><i class="fa-solid fa-microphone-lines mr-2"></i>SPIK</h1>
        <button id="theme-toggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition">
            <i id="theme-icon" class="fa-solid fa-moon"></i>
        </button>
    </header>

    <!-- Main Content -->
    <main class="flex-grow w-full max-w-2xl mx-auto p-4 flex flex-col gap-6 mt-4">
        
        <!-- Instruksi -->
        <div class="bg-blue-50 dark:bg-blue-900/30 border-l-4 border-primary p-4 rounded-r-lg space-y-2">
            <p class="text-sm font-medium">Cara Berlatih dengan Spik:</p>
            <ul class="text-sm list-disc list-inside space-y-1">
                <li>Dengarkan pengucapan asli dan ikuti teks panduan fonetik di bawahnya.</li>
                <li>Perhatikan warna: <span class="text-subject dark:text-blue-400 font-bold">Biru = Pelaku</span>, <span class="text-verb dark:text-red-400 font-bold">Merah = Aksi</span>.</li>
            </ul>
        </div>

        <!-- Area Kartu Latihan -->
        <div id="lesson-container" class="space-y-6">
            <!-- Kartu akan di-render di sini -->
        </div>

    </main>

    <footer class="text-center p-4 text-sm text-gray-500 dark:text-gray-400 mt-auto font-medium">
        &copy; 2026 Spik. Baca Inggris Tanpa Meringis.
    </footer>

    <script>
        // Data Latihan Spik
        const lessons = [
            {
                id: 1,
                displayHTML: "<span class='text-subject dark:text-blue-400 font-bold'>I</span> <span class='text-verb dark:text-red-400 font-bold'>want to learn</span> how to speak English naturally.",
                speakText: "I want to learn how to speak English naturally.",
                phonetic: "/ Ai won tu lern hau tu spik ingglis necereli /"
            },
            {
                id: 2,
                displayHTML: "Though the weather is rough, <span class='text-subject dark:text-blue-400 font-bold'>we</span> <span class='text-verb dark:text-red-400 font-bold'>will walk</span> through it.",
                speakText: "Though the weather is rough, we will walk through it.",
                phonetic: "/ Dzo de weder is raf, wi wil wok thru it /"
            },
            {
                id: 3,
                displayHTML: "<span class='text-subject dark:text-blue-400 font-bold'>Knowledge</span> <span class='text-verb dark:text-red-400 font-bold'>is</span> power.",
                speakText: "Knowledge is power.",
                phonetic: "/ Nolej is pawer /"
            }
        ];

        const lessonContainer = document.getElementById('lesson-container');

        function renderLessons() {
            lessons.forEach((lesson) => {
                const card = document.createElement('div');
                card.className = "bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 p-6 transition-all hover:shadow-md";
                
                card.innerHTML = `
                    <div class="flex justify-between items-start gap-4">
                        <div class="flex-grow">
                            <h2 class="text-2xl font-semibold mb-3 tracking-wide text-gray-900 dark:text-white leading-relaxed">
                                ${lesson.displayHTML}
                            </h2>
                            <p class="text-lg text-primary font-mono bg-blue-50 dark:bg-gray-700/50 inline-block px-3 py-1 rounded-md">
                                ${lesson.phonetic}
                            </p>
                        </div>
                        <button onclick="playAudio('${lesson.speakText}')" class="flex-shrink-0 bg-primary hover:bg-blue-600 text-white p-4 rounded-full shadow-lg transition-transform transform hover:scale-105 active:scale-95 flex items-center justify-center h-14 w-14">
                            <i class="fa-solid fa-volume-high text-xl"></i>
                        </button>
                    </div>
                `;
                lessonContainer.appendChild(card);
            });
        }

        function playAudio(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.85; 
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Maaf, browser Anda tidak mendukung fitur suara.");
            }
        }

        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const htmlElement = document.documentElement;

        themeToggleBtn.addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            if (htmlElement.classList.contains('dark')) {
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
            } else {
                themeIcon.classList.remove('fa-sun');
                themeIcon.classList.add('fa-moon');
            }
        });

        renderLessons();
    </script>
</body>
</html>
