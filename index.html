<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spik - Travel Companion</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3898/3898082.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: '#3b82f6' } } }
        }
    </script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

    <style>
        .grammar-active .tag-subject { color: #2563eb; font-weight: 700; cursor: help; border-bottom: 2px dotted #2563eb; transition: all 0.2s; }
        .grammar-active .tag-verb { color: #dc2626; font-weight: 700; cursor: help; border-bottom: 2px dotted #dc2626; transition: all 0.2s; }
        .dark .grammar-active .tag-subject { color: #60a5fa; border-bottom-color: #60a5fa; }
        .dark .grammar-active .tag-verb { color: #f87171; border-bottom-color: #f87171; }

        rt.arti-indo { display: none; }
        .translate-active rt.arti-indo { display: ruby-text; font-size: 0.75rem; color: #059669; font-family: sans-serif; font-weight: 700; }
        .dark .translate-active rt.arti-indo { color: #34d399; }
        .translate-active #document-content { line-height: 2.5; }

        .phonetic-input-wrapper { display: none; }
        .phonetic-active .phonetic-input-wrapper { display: block; }
        
        /* Highlight khusus terjemahan jawaban lawan bicara */
        .reply-translation { color: #d97706; font-weight: bold; font-size: 0.9em; margin-top: 0.5rem; display: block;}
        .dark .reply-translation { color: #fbbf24; }

        @media print {
            body { background-color: white !important; }
            header, #control-panel, .print-hidden, footer { display: none !important; }
            #paper-workspace { box-shadow: none !important; margin: 0 !important; padding: 0 !important; max-width: 100% !important; background-color: transparent !important; }
            .phonetic-input { border: none !important; color: #4b5563 !important; }
            .grammar-active .tag-subject { color: #2563eb !important; border-bottom: none !important;}
            .grammar-active .tag-verb { color: #dc2626 !important; border-bottom: none !important;}
            .translate-active rt.arti-indo { color: #059669 !important; }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 dark:bg-gray-900 dark:text-gray-200 transition-colors duration-300 min-h-screen flex flex-col font-sans">

    <header class="bg-white dark:bg-gray-800 shadow-md p-4 sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-2xl font-black text-primary tracking-tighter"><i class="fa-solid fa-plane-departure mr-2"></i>SPIK <span class="text-sm font-normal text-gray-500 dark:text-gray-400">Travel</span></h1>
        
        <div class="flex items-center gap-3">
            <button id="install-btn" class="hidden bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded shadow transition font-medium flex items-center text-sm">
                <i class="fa-solid fa-download mr-1"></i> Install App
            </button>
            <button id="theme-toggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition">
                <i id="theme-icon" class="fa-solid fa-moon"></i>
            </button>
        </div>
    </header>

    <main class="flex-grow w-full max-w-6xl mx-auto p-4 flex flex-col gap-6 mt-4">
        
        <div id="control-panel" class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
            <div class="flex justify-between items-center mb-2 flex-wrap gap-2">
                <label class="block text-sm font-semibold dark:text-gray-300">
                    <i class="fa-solid fa-comments mr-2"></i>Area Percakapan & Naskah:
                </label>
                
                <div class="flex items-center gap-2">
                    <input type="file" id="file-upload" class="hidden" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg" onchange="handleFileUpload(event)">
                    <button onclick="document.getElementById('file-upload').click()" class="text-xs font-semibold px-3 py-1.5 rounded bg-indigo-100 dark:bg-indigo-900/50 hover:bg-indigo-200 text-indigo-700 dark:text-indigo-300 transition flex items-center cursor-pointer shadow-sm border border-indigo-200 dark:border-indigo-700">
                        <i class="fa-solid fa-file-arrow-up mr-1"></i> Upload File
                    </button>

                    <span id="mic-status" class="text-xs font-semibold px-2.5 py-1.5 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-500 shadow-sm border border-gray-200 dark:border-gray-600">
                        Mic Siap
                    </span>
                </div>
            </div>

            <textarea id="inputText" rows="4" class="w-full p-4 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-2 focus:ring-primary outline-none transition resize-y" placeholder="Bicara lewat mic, atau ketik teks di sini..."></textarea>
            
            <div class="flex flex-wrap gap-2 mt-4 items-center">
                <!-- FITUR BARU: KAMUS DARURAT OFFLINE -->
                <select id="travel-phrases" onchange="insertTravelPhrase()" class="bg-rose-600 text-white px-3 py-2 rounded shadow font-medium text-sm outline-none cursor-pointer">
                    <option value="">🆘 Frasa Darurat Offline</option>
                    <option value="I need help, please. (Saya butuh bantuan.)">Minta Bantuan</option>
                    <option value="Where is the toilet? (Dimana toilet?)">Tanya Toilet</option>
                    <option value="How much does this cost? (Berapa harganya?)">Tanya Harga</option>
                    <option value="I do not speak English well. (Saya tidak terlalu bisa bahasa Inggris.)">Tidak Bisa Inggris</option>
                    <option value="Can you take me to the airport? (Bisa antar saya ke bandara?)">Ke Bandara</option>
                    <option value="Is there a pharmacy nearby? (Apakah ada apotek di dekat sini?)">Cari Apotek</option>
                    <option value="I want to buy food. (Saya ingin membeli makanan.)">Beli Makanan</option>
                </select>

                <div class="h-6 w-px bg-gray-300 dark:bg-gray-600 mx-1 hidden md:block"></div>

                <button id="btn-mic-en" onclick="toggleListening('en-US')" class="bg-amber-600 hover:bg-amber-700 text-white px-3 py-2 rounded shadow transition font-medium flex items-center text-sm">
                    <i id="mic-icon-en" class="fa-solid fa-ear-listen mr-2"></i> <span id="mic-text-en">Dengar Bule (EN)</span>
                </button>
                <button id="btn-mic-id" onclick="toggleListening('id-ID')" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded shadow transition font-medium flex items-center text-sm">
                    <i id="mic-icon-id" class="fa-solid fa-microphone-lines mr-2"></i> <span id="mic-text-id">Bicara Indo (ID)</span>
                </button>
                
                <div class="h-6 w-px bg-gray-300 dark:bg-gray-600 mx-1 hidden md:block"></div>

                <button id="btn-input-translate" onclick="toggleInputTranslation()" class="bg-gray-500 hover:bg-gray-600 text-white px-3 py-2 rounded shadow transition font-medium flex items-center text-sm" title="Jika ON, teks Indo yang diketik akan jadi Inggris">
                    <i id="input-translate-icon" class="fa-solid fa-arrow-right-arrow-left mr-2"></i> <span id="input-translate-text">Ketik Indo (OFF)</span>
                </button>

                <button onclick="processText()" class="bg-primary text-white px-4 py-2 rounded shadow hover:bg-blue-600 transition font-medium flex items-center text-sm">
                    <i class="fa-solid fa-wand-magic-sparkles mr-2"></i> Tampilkan
                </button>
                
                <button id="btn-grammar" onclick="toggleGrammar()" class="bg-purple-600 text-white px-3 py-2 rounded shadow transition font-medium flex items-center text-sm print-hidden">
                    <i id="grammar-icon" class="fa-solid fa-eye mr-2"></i> <span id="grammar-text">Pola (ON)</span>
                </button>
                <button id="btn-translate" onclick="toggleTranslate()" class="bg-teal-600 text-white px-3 py-2 rounded shadow transition font-medium flex items-center text-sm print-hidden">
                    <i id="translate-icon" class="fa-solid fa-language mr-2"></i> <span id="translate-text">Makna (ON)</span>
                </button>
                <button id="btn-phonetic" onclick="togglePhonetic()" class="bg-sky-600 text-white px-3 py-2 rounded shadow transition font-medium flex items-center text-sm print-hidden">
                    <i id="phonetic-icon" class="fa-solid fa-comment-dots mr-2"></i> <span id="phonetic-text">Bacaan (ON)</span>
                </button>
            </div>
            
            <div id="loading-indicator" class="hidden mt-3 text-sm text-blue-600 font-semibold animate-pulse">
                <i id="loading-icon" class="fa-solid fa-spinner fa-spin mr-2"></i> <span id="loading-text">Menerjemahkan... (Butuh Sinyal Internet)</span>
            </div>
        </div>

        <div class="overflow-x-auto pb-8">
            <div id="paper-workspace" class="grammar-active translate-active phonetic-active bg-white text-gray-900 mx-auto p-10 md:p-16 shadow-lg rounded-sm w-full max-w-[21cm] min-h-[29.7cm] border border-gray-300 dark:border-none transition-none relative">
                
                <div id="color-legend" class="hidden mb-6 bg-blue-50 p-3 rounded text-sm print-hidden flex flex-wrap gap-4 justify-between items-center border border-blue-100">
                    <div><strong>Petunjuk:</strong> <span class="text-blue-600 font-bold ml-1">Biru = Subjek</span> | <span class="text-red-600 font-bold">Merah = Kata Kerja</span></div>
                    <div class="text-emerald-600 font-bold"><i class="fa-solid fa-language"></i> Hijau = Makna Gandul</div>
                </div>

                <div id="document-content" class="space-y-8 font-serif text-xl leading-relaxed"></div>
            </div>
        </div>
    </main>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        // Kamus Offline Cepat
        const spikDictionary = {
            "i": { p: "ai", c: "subject", i: "saya" }, "you": { p: "yu", c: "subject", i: "kamu" }, 
            "they": { p: "dei", c: "subject", i: "mereka" }, "we": { p: "wi", c: "subject", i: "kami" }, 
            "he": { p: "hi", c: "subject", i: "dia(L)" }, "she": { p: "syi", c: "subject", i: "dia(P)" }, 
            "it": { p: "it", c: "subject", i: "itu" }, "us": { p: "as", c: "subject", i: "kita" },
            "am": { p: "em", c: "verb", i: "adalah" }, "is": { p: "is", c: "verb", i: "adalah" }, "are": { p: "ar", c: "verb", i: "adalah" },
            "do": { p: "du", c: "verb", i: "melakukan" }, "have": { p: "hev", c: "verb", i: "memiliki" }, "can": { p: "ken", c: "verb", i: "bisa" },
            "will": { p: "wil", c: "verb", i: "akan" }, "the": { p: "de", c: "", i: "" }, "a": { p: "e", c: "", i: "sebuah" },
            "need": { p: "nid", c: "verb", i: "butuh" }, "help": { p: "help", c: "verb", i: "bantuan" },
            "please": { p: "plis", c: "", i: "tolong" }, "where": { p: "wer", c: "", i: "dimana" },
            "toilet": { p: "toilit", c: "", i: "toilet" }, "how": { p: "hau", c: "", i: "bagaimana/berapa" },
            "much": { p: "mac", c: "", i: "banyak" }, "cost": { p: "kost", c: "verb", i: "harga" },
            "airport": { p: "erport", c: "", i: "bandara" }, "food": { p: "fud", c: "", i: "makanan" },
            "want": { p: "won", c: "verb", i: "ingin" }, "buy": { p: "bai", c: "verb", i: "beli" }
        };

        function insertTravelPhrase() {
            const select = document.getElementById('travel-phrases');
            if(select.value !== "") {
                document.getElementById('inputText').value = select.value;
                processText(true); // Langsung proses tanpa memanggil terjemahan internet
                select.value = ""; // Reset
            }
        }

        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const loadingIndicator = document.getElementById('loading-indicator');
            const loadingText = document.getElementById('loading-text');
            const textArea = document.getElementById('inputText');
            
            loadingText.innerText = `Sedang mengekstrak teks dari file ${file.name}...`;
            loadingIndicator.classList.remove('hidden');

            try {
                let extractedText = '';
                const fileType = file.name.split('.').pop().toLowerCase();

                if (fileType === 'pdf') {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                    let fullText = '';
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        fullText += textContent.items.map(item => item.str).join(' ') + '\n';
                    }
                    extractedText = fullText;
                } else if (fileType === 'doc' || fileType === 'docx') {
                    const arrayBuffer = await file.arrayBuffer();
                    const result = await mammoth.extractRawText({arrayBuffer: arrayBuffer});
                    extractedText = result.value;
                } else if (['png', 'jpg', 'jpeg'].includes(fileType)) {
                    const result = await Tesseract.recognize(file, 'eng+ind');
                    extractedText = result.data.text;
                }

                if (extractedText.trim() !== '') {
                    if (textArea.value.trim() !== '') textArea.value += '\n\n';
                    textArea.value += extractedText.trim();
                } else {
                    alert('Gagal menemukan teks.');
                }
            } catch (error) {
                alert('Gagal membaca file.');
            } finally {
                loadingIndicator.classList.add('hidden');
                event.target.value = ''; 
            }
        }

        // KELOMPOK SAKLAR
        let isGrammarActive = true;
        function toggleGrammar() {
            isGrammarActive = !isGrammarActive;
            const workspace = document.getElementById('paper-workspace');
            const btn = document.getElementById('btn-grammar');
            if (isGrammarActive) {
                workspace.classList.add('grammar-active');
                document.getElementById('grammar-text').innerText = "Pola (ON)";
                btn.classList.replace('bg-gray-500', 'bg-purple-600');
            } else {
                workspace.classList.remove('grammar-active');
                document.getElementById('grammar-text').innerText = "Pola (OFF)";
                btn.classList.replace('bg-purple-600', 'bg-gray-500');
            }
        }

        let isTranslateActive = true;
        function toggleTranslate() {
            isTranslateActive = !isTranslateActive;
            const workspace = document.getElementById('paper-workspace');
            const btn = document.getElementById('btn-translate');
            if (isTranslateActive) {
                workspace.classList.add('translate-active');
                document.getElementById('translate-text').innerText = "Makna (ON)";
                btn.classList.replace('bg-gray-500', 'bg-teal-600');
            } else {
                workspace.classList.remove('translate-active');
                document.getElementById('translate-text').innerText = "Makna (OFF)";
                btn.classList.replace('bg-teal-600', 'bg-gray-500');
            }
        }

        let isPhoneticActive = true;
        function togglePhonetic() {
            isPhoneticActive = !isPhoneticActive;
            const workspace = document.getElementById('paper-workspace');
            const btn = document.getElementById('btn-phonetic');
            if (isPhoneticActive) {
                workspace.classList.add('phonetic-active');
                document.getElementById('phonetic-text').innerText = "Bacaan (ON)";
                btn.classList.replace('bg-gray-500', 'bg-sky-600');
            } else {
                workspace.classList.remove('phonetic-active');
                document.getElementById('phonetic-text').innerText = "Bacaan (OFF)";
                btn.classList.replace('bg-sky-600', 'bg-gray-500');
            }
        }

        let isInputIdToEnActive = false;
        function toggleInputTranslation() {
            isInputIdToEnActive = !isInputIdToEnActive;
            const btn = document.getElementById('btn-input-translate');
            if (isInputIdToEnActive) {
                document.getElementById('input-translate-text').innerText = "Ketik Indo (ON)";
                btn.classList.replace('bg-gray-500', 'bg-pink-600');
            } else {
                document.getElementById('input-translate-text').innerText = "Ketik Indo (OFF)";
                btn.classList.replace('bg-pink-600', 'bg-gray-500');
            }
        }

        // FITUR TERJEMAHAN DUA ARAH (Butuh Internet)
        async function translateAPI(text, sourceLang, targetLang) {
            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
                const response = await fetch(url);
                const data = await response.json();
                let translatedResult = '';
                data[0].forEach(item => { if(item[0]) translatedResult += item[0]; });
                return translatedResult;
            } catch (error) { return text; }
        }

        let recognition = null;
        let isListening = false;
        let currentMicMode = '';
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = async (event) => {
                let currentSpeech = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    currentSpeech += event.results[i][0].transcript;
                }
                const textArea = document.getElementById('inputText');
                const loadingIndicator = document.getElementById('loading-indicator');
                
                // Jika sedang bicara bahasa Indonesia (ID -> EN)
                if (currentMicMode === 'id-ID') {
                    loadingIndicator.classList.remove('hidden');
                    document.getElementById('loading-text').innerText = "Mengubah suara Indo ke tulisan Inggris...";
                    const translatedSpeech = await translateAPI(currentSpeech, 'id', 'en');
                    currentSpeech = translatedSpeech;
                    loadingIndicator.classList.add('hidden');
                } 
                // FITUR BARU TRAVEL: Jika sedang mendengar Bule bicara Inggris (EN -> ID)
                else if (currentMicMode === 'en-US') {
                    loadingIndicator.classList.remove('hidden');
                    document.getElementById('loading-text').innerText = "Menerjemahkan ucapan Bule ke bahasa Indonesia...";
                    const artiIndo = await translateAPI(currentSpeech, 'en', 'id');
                    // Tampilkan bahasa Inggrisnya, DITAMBAH arti bahasa Indonesianya di dalam kurung
                    if(artiIndo !== currentSpeech) {
                        currentSpeech = currentSpeech + "\n<Terjemahan: " + artiIndo + ">";
                    }
                    loadingIndicator.classList.add('hidden');
                }

                if (textArea.value.trim() === '') { textArea.value = currentSpeech.trim(); } 
                else { textArea.value += '\n\n' + currentSpeech.trim(); }
                processText(true); 
            };
            recognition.onend = () => { if (isListening) recognition.start(); };
        }

        function toggleListening(langCode) {
            if (!recognition) return alert("Browser tidak support. Instal Google Chrome terbaru.");
            if (isListening) {
                if (currentMicMode === langCode) { stopListening(); } 
                else { stopListening(); setTimeout(() => startListening(langCode), 500); }
            } else { startListening(langCode); }
        }

        function startListening(langCode) {
            isListening = true; currentMicMode = langCode; recognition.lang = langCode; recognition.start();
            resetMicButtons();
            const status = document.getElementById('mic-status');
            if (langCode === 'en-US') {
                document.getElementById('btn-mic-en').className = "bg-red-600 text-white px-3 py-2 rounded shadow transition font-medium flex items-center text-sm animate-pulse";
                document.getElementById('mic-text-en').innerText = "Stop Dengar";
                status.innerText = "Mendengar Bule (Butuh Internet)";
            } else {
                document.getElementById('btn-mic-id').className = "bg-red-600 text-white px-3 py-2 rounded shadow transition font-medium flex items-center text-sm animate-pulse";
                document.getElementById('mic-text-id').innerText = "Stop Bicara";
                status.innerText = "Merekam Suara Anda";
            }
            status.className = "text-xs font-semibold px-2.5 py-0.5 rounded-full bg-red-100 text-red-700 shadow-sm";
        }

        function stopListening() {
            isListening = false; currentMicMode = ''; if (recognition) recognition.stop();
            resetMicButtons();
            const status = document.getElementById('mic-status');
            status.className = "text-xs font-semibold px-2.5 py-1.5 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-500 shadow-sm";
            status.innerText = "Mic Siap";
        }

        function resetMicButtons() {
            document.getElementById('btn-mic-en').className = "bg-amber-600 hover:bg-amber-700 text-white px-3 py-2 rounded shadow transition font-medium flex items-center text-sm";
            document.getElementById('mic-text-en').innerText = "Dengar Bule (EN)";
            document.getElementById('btn-mic-id').className = "bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded shadow transition font-medium flex items-center text-sm";
            document.getElementById('mic-text-id').innerText = "Bicara Indo (ID)";
        }

        async function processText(skipTranslation = false) {
            let rawText = document.getElementById('inputText').value;
            const docContent = document.getElementById('document-content');
            const colorLegend = document.getElementById('color-legend');
            const loadingIndicator = document.getElementById('loading-indicator');
            
            docContent.innerHTML = '';
            if(!rawText.trim()) { colorLegend.classList.add('hidden'); return; }

            if (isInputIdToEnActive && !skipTranslation) {
                loadingIndicator.classList.remove('hidden');
                document.getElementById('loading-text').innerText = "Menerjemahkan teks...";
                const translated = await translateAPI(rawText, 'id', 'en');
                if (translated) rawText = translated;
                loadingIndicator.classList.add('hidden');
            }

            colorLegend.classList.remove('hidden');
            const paragraphs = rawText.split('\n').filter(p => p.trim() !== '');

            paragraphs.forEach((para) => {
                const block = document.createElement('div');
                block.className = "relative group mb-6";
                
                // Deteksi jika baris ini adalah hasil terjemahan dari lawan bicara (ditandai dengan <Terjemahan: ... >)
                const translationMatch = para.match(/<Terjemahan:\s*(.*?)>/);
                if(translationMatch) {
                    block.innerHTML = `<p class="reply-translation"><i class="fa-solid fa-language mr-1"></i> Orang itu bilang: "${translationMatch[1]}"</p>`;
                    docContent.appendChild(block);
                    return; // Lanjut ke baris berikutnya
                }

                const safeTextToSpeak = para.replace(/'/g, "\\'");
                const rawWords = para.split(/\s+/);
                let displayHTMLWords = [];
                let phoneticWords = [];

                rawWords.forEach(rawWord => {
                    const match = rawWord.match(/^([^.,?!;:()\[\]]*)([.,?!;:()\[\]]*)$/);
                    let coreWord = match ? match[1] : rawWord;
                    let punctuation = match ? match[2] : "";

                    const cleanWord = coreWord.toLowerCase();
                    const dictionaryEntry = spikDictionary[cleanWord];

                    if (dictionaryEntry) {
                        phoneticWords.push(dictionaryEntry.p + punctuation);
                        let formattedWord = coreWord;
                        if (dictionaryEntry.c === "subject") formattedWord = `<span class="tag-subject" title="Subjek">${coreWord}</span>`;
                        else if (dictionaryEntry.c === "verb") formattedWord = `<span class="tag-verb" title="Kata Kerja">${coreWord}</span>`;
                        
                        if (dictionaryEntry.i && dictionaryEntry.i !== "") {
                            formattedWord = `<ruby>${formattedWord}<rt class="arti-indo">${dictionaryEntry.i}</rt></ruby>`;
                        }
                        displayHTMLWords.push(formattedWord + punctuation);
                    } else {
                        phoneticWords.push(cleanWord + punctuation);
                        displayHTMLWords.push(rawWord);
                    }
                });

                const finalDisplayHTML = displayHTMLWords.join(" ");
                const finalPhoneticText = "/ " + phoneticWords.join(" ") + " /";

                block.innerHTML = `
                    <div class="pr-12">
                        <p class="text-xl mb-3 text-justify text-gray-900">${finalDisplayHTML}</p>
                        <div class="phonetic-input-wrapper">
                            <div contenteditable="true" class="phonetic-input w-full text-blue-600 font-mono text-lg bg-transparent border-b border-dashed border-gray-400 focus:outline-none focus:border-blue-500 outline-none pb-1 break-words leading-relaxed">${finalPhoneticText}</div>
                        </div>
                    </div>
                    <button onclick="playAudio('${safeTextToSpeak}')" class="print-hidden absolute top-0 right-0 w-10 h-10 bg-gray-100 hover:bg-primary hover:text-white rounded-full flex items-center justify-center text-gray-500 transition shadow-sm border border-gray-200 mt-2">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                `;
                docContent.appendChild(block);
            });
        }

        function playAudio(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.85; 
                window.speechSynthesis.speak(utterance);
            }
        }

        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const htmlElement = document.documentElement;
        themeToggleBtn.addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            themeIcon.className = htmlElement.classList.contains('dark') ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        });

        // --- PWA SERVICE WORKER (Bypass Cache Update) ---
        let deferredPrompt;
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    reg.update(); // Selalu paksa update cache PWA setiap web dibuka
                }).catch(err => console.log('PWA Service Worker tidak terdaftar.'));
            });
        }
    </script>
</body>
</html>
