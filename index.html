<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spik - Naskah & Live Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: { colors: { primary: '#3b82f6' } }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .grammar-active .tag-subject { color: #2563eb; font-weight: 700; cursor: help; border-bottom: 2px dotted #2563eb; transition: all 0.2s; }
        .grammar-active .tag-verb { color: #dc2626; font-weight: 700; cursor: help; border-bottom: 2px dotted #dc2626; transition: all 0.2s; }
        .dark .grammar-active .tag-subject { color: #60a5fa; border-bottom-color: #60a5fa; }
        .dark .grammar-active .tag-verb { color: #f87171; border-bottom-color: #f87171; }

        rt.arti-indo { display: none; }
        .translate-active rt.arti-indo { display: ruby-text; font-size: 0.75rem; color: #059669; font-family: sans-serif; font-weight: 700; }
        .dark .translate-active rt.arti-indo { color: #34d399; }
        .translate-active #document-content { line-height: 2.5; }

        @media print {
            body { background-color: white !important; }
            header, #control-panel, .print-hidden, footer { display: none !important; }
            #paper-workspace { box-shadow: none !important; margin: 0 !important; padding: 0 !important; max-width: 100% !important; background-color: transparent !important; }
            .phonetic-input { border: none !important; color: #4b5563 !important; }
            .grammar-active .tag-subject { color: #2563eb !important; border-bottom: none !important;}
            .grammar-active .tag-verb { color: #dc2626 !important; border-bottom: none !important;}
            .translate-active rt.arti-indo { color: #059669 !important; }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 dark:bg-gray-900 dark:text-gray-200 transition-colors duration-300 min-h-screen flex flex-col font-sans">

    <header class="bg-white dark:bg-gray-800 shadow-md p-4 sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-2xl font-black text-primary tracking-tighter"><i class="fa-solid fa-microphone-lines mr-2"></i>SPIK <span class="text-sm font-normal text-gray-500 dark:text-gray-400">Studio</span></h1>
        <button id="theme-toggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition">
            <i id="theme-icon" class="fa-solid fa-moon"></i>
        </button>
    </header>

    <main class="flex-grow w-full max-w-6xl mx-auto p-4 flex flex-col gap-6 mt-4">
        
        <div id="control-panel" class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
            <div class="flex justify-between items-center mb-2">
                <label class="block text-sm font-semibold dark:text-gray-300">
                    <i class="fa-solid fa-file-lines mr-2"></i>Teks Naskah / Hasil Dengar:
                </label>
                <span id="mic-status" class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-500">
                    Mic Siap
                </span>
            </div>

            <textarea id="inputText" rows="4" class="w-full p-4 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-2 focus:ring-primary outline-none transition resize-y" placeholder="Ketik/paste naskah (Inggris atau Indonesia), lalu gunakan pengatur di bawah..."></textarea>
            
            <div class="flex flex-wrap gap-2 mt-4 items-center">
                <button id="btn-mic-en" onclick="toggleListening('en-US')" class="bg-amber-600 hover:bg-amber-700 text-white px-3 py-2 rounded shadow transition font-medium flex items-center text-sm">
                    <i id="mic-icon-en" class="fa-solid fa-ear-listen mr-2"></i> <span id="mic-text-en">Dengar Teman (EN)</span>
                </button>
                <button id="btn-mic-id" onclick="toggleListening('id-ID')" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded shadow transition font-medium flex items-center text-sm">
                    <i id="mic-icon-id" class="fa-solid fa-microphone-lines mr-2"></i> <span id="mic-text-id">Bicara Indo (ID)</span>
                </button>
                
                <div class="h-6 w-px bg-gray-300 dark:bg-gray-600 mx-1"></div>

                <button id="btn-input-translate" onclick="toggleInputTranslation()" class="bg-gray-500 hover:bg-gray-600 text-white px-3 py-2 rounded shadow transition font-medium flex items-center text-sm">
                    <i id="input-translate-icon" class="fa-solid fa-arrow-right-arrow-left mr-2"></i> <span id="input-translate-text">Input Indo (OFF)</span>
                </button>

                <button onclick="processText()" class="bg-primary text-white px-4 py-2 rounded shadow hover:bg-blue-600 transition font-medium flex items-center text-sm">
                    <i class="fa-solid fa-wand-magic-sparkles mr-2"></i> Buat Naskah
                </button>
                
                <button id="btn-grammar" onclick="toggleGrammar()" class="bg-purple-600 text-white px-3 py-2 rounded shadow hover:bg-purple-700 transition font-medium flex items-center text-sm">
                    <i id="grammar-icon" class="fa-solid fa-eye mr-2"></i> <span id="grammar-text">Warna Pola (ON)</span>
                </button>
                <button id="btn-translate" onclick="toggleTranslate()" class="bg-gray-500 text-white px-3 py-2 rounded shadow hover:bg-gray-600 transition font-medium flex items-center text-sm">
                    <i id="translate-icon" class="fa-solid fa-language mr-2"></i> <span id="translate-text">Makna Gandul (ON)</span>
                </button>

                <button onclick="window.print()" class="bg-green-600 text-white px-3 py-2 rounded shadow hover:bg-green-700 transition font-medium flex items-center text-sm ml-auto">
                    <i class="fa-solid fa-file-pdf mr-2"></i> Cetak PDF
                </button>
            </div>
            
            <div id="loading-indicator" class="hidden mt-3 text-sm text-blue-600 font-semibold animate-pulse">
                <i class="fa-solid fa-spinner fa-spin mr-2"></i> Sedang menerjemahkan teks ke bahasa Inggris...
            </div>
        </div>

        <div class="overflow-x-auto pb-8">
            <div id="paper-workspace" class="grammar-active translate-active bg-white text-gray-900 mx-auto p-10 md:p-16 shadow-lg rounded-sm w-full max-w-[21cm] min-h-[29.7cm] border border-gray-300 dark:border-none transition-none relative">
                
                <div class="text-center mb-8 border-b-2 border-gray-800 pb-4 print-hidden">
                    <h2 class="text-3xl font-serif font-bold text-gray-300">AREA KERTAS NASKAH</h2>
                </div>

                <div id="color-legend" class="hidden mb-6 bg-blue-50 p-3 rounded text-sm print-hidden flex flex-wrap gap-4 justify-between items-center border border-blue-100">
                    <div><strong>Petunjuk:</strong> <span class="text-blue-600 font-bold ml-1">Biru = Subjek</span> | <span class="text-red-600 font-bold">Merah = Kata Kerja</span></div>
                    <div class="text-emerald-600 font-bold"><i class="fa-solid fa-language"></i> Hijau = Makna Gandul</div>
                </div>

                <div id="document-content" class="space-y-8 font-serif text-xl leading-relaxed"></div>
            </div>
        </div>
    </main>

    <footer class="text-center p-4 text-sm text-gray-500 dark:text-gray-400 mt-auto font-medium print-hidden">
        &copy; 2026 Spik. Baca Inggris Tanpa Meringis.
    </footer>

            "always": { p: "olweis", c: "", i: "senantiasa" }, "devoted": { p: "divotid", c: "verb", i: "bertaqwa" },

            "of": { p: "ov", c: "", i: "dari" }, "then": { p: "den", c: "", i: "maka/lalu" },
            "easier": { p: "izier", c: "", i: "mempermudah" }, "little": { p: "litel", c: "", i: "sedikit" },

        // --- SAKLAR ---
        let isGrammarActive = true;
        function toggleGrammar() {
            isGrammarActive = !isGrammarActive;
            const workspace = document.getElementById('paper-workspace');
            const btn = document.getElementById('btn-grammar');
            if (isGrammarActive) {
                workspace.classList.add('grammar-active');
                document.getElementById('grammar-icon').className = "fa-solid fa-eye mr-2";
                document.getElementById('grammar-text').innerText = "Warna Pola (ON)";
                btn.classList.replace('bg-gray-500', 'bg-purple-600');
                btn.classList.replace('hover:bg-gray-600', 'hover:bg-purple-700');
            } else {
                workspace.classList.remove('grammar-active');
                document.getElementById('grammar-icon').className = "fa-solid fa-eye-slash mr-2";
                document.getElementById('grammar-text').innerText = "Warna Pola (OFF)";
                btn.classList.replace('bg-purple-600', 'bg-gray-500');
                btn.classList.replace('hover:bg-purple-700', 'hover:bg-gray-600');
            }
        }

        let isTranslateActive = true; 
        function toggleTranslate() {
            isTranslateActive = !isTranslateActive;
            const workspace = document.getElementById('paper-workspace');
            const btn = document.getElementById('btn-translate');
            if (isTranslateActive) {
                workspace.classList.add('translate-active');
                document.getElementById('translate-text').innerText = "Makna Gandul (ON)";
                btn.classList.replace('bg-gray-500', 'bg-teal-600');
                btn.classList.replace('hover:bg-gray-600', 'hover:bg-teal-700');
            } else {
                workspace.classList.remove('translate-active');
                document.getElementById('translate-text').innerText = "Makna Gandul (OFF)";
                btn.classList.replace('bg-teal-600', 'bg-gray-500');
                btn.classList.replace('hover:bg-teal-700', 'hover:bg-gray-600');
            }
        }

        let isInputIdToEnActive = false;
        function toggleInputTranslation() {
            isInputIdToEnActive = !isInputIdToEnActive;
            const btn = document.getElementById('btn-input-translate');
            if (isInputIdToEnActive) {
                document.getElementById('input-translate-text').innerText = "Input Indo (ON)";
                btn.classList.replace('bg-gray-500', 'bg-pink-600');
                btn.classList.replace('hover:bg-gray-600', 'hover:bg-pink-700');
            } else {
                document.getElementById('input-translate-text').innerText = "Input Indo (OFF)";
                btn.classList.replace('bg-pink-600', 'bg-gray-500');
                btn.classList.replace('hover:bg-pink-700', 'hover:bg-gray-600');
            }
        }

        async function translateIdToEn(text) {
            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=id&tl=en&dt=t&q=${encodeURIComponent(text)}`;
                const response = await fetch(url);
                const data = await response.json();
                let translatedResult = '';
                data[0].forEach(item => { if(item[0]) translatedResult += item[0]; });
                return translatedResult;
            } catch (error) { return text; }
        }

        let recognition = null;
        let isListening = false;
        let currentMicMode = '';
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = async (event) => {
                let currentSpeech = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    currentSpeech += event.results[i][0].transcript;
                }
                const textArea = document.getElementById('inputText');
                if (currentMicMode === 'id-ID') {
                    document.getElementById('loading-indicator').classList.remove('hidden');
                    const translatedSpeech = await translateIdToEn(currentSpeech);
                    currentSpeech = translatedSpeech === currentSpeech ? "(Gagal terjemah: " + currentSpeech + ")" : translatedSpeech;
                    document.getElementById('loading-indicator').classList.add('hidden');
                }
                if (textArea.value.trim() === '') { textArea.value = currentSpeech.trim(); } 
                else { textArea.value += '\n' + currentSpeech.trim(); }
                processText(true); 
            };
            recognition.onend = () => { if (isListening) recognition.start(); };
        }

        function toggleListening(langCode) {
            if (!recognition) return alert("Gunakan Chrome/Edge untuk fitur ini.");
            if (isListening) {
                if (currentMicMode === langCode) { stopListening(); } 
                else { stopListening(); setTimeout(() => startListening(langCode), 500); }
            } else { startListening(langCode); }
        }

        function startListening(langCode) {
            isListening = true; currentMicMode = langCode; recognition.lang = langCode; recognition.start();
            resetMicButtons();
            const status = document.getElementById('mic-status');
            if (langCode === 'en-US') {
                document.getElementById('btn-mic-en').className = "bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded shadow transition font-medium flex items-center text-sm animate-pulse";
                document.getElementById('mic-text-en').innerText = "Stop Dengar";
                document.getElementById('mic-icon-en').className = "fa-solid fa-circle-stop mr-2";
                status.innerText = "Mic AKTIF (Dengar Inggris)";
            } else {
                document.getElementById('btn-mic-id').className = "bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded shadow transition font-medium flex items-center text-sm animate-pulse";
                document.getElementById('mic-text-id').innerText = "Stop Bicara";
                document.getElementById('mic-icon-id').className = "fa-solid fa-circle-stop mr-2";
                status.innerText = "Mic AKTIF (Bicara Indo)";
            }
            status.className = "text-xs font-semibold px-2.5 py-0.5 rounded-full bg-red-100 text-red-700";
        }

        function stopListening() {
            isListening = false; currentMicMode = ''; if (recognition) recognition.stop();
            resetMicButtons();
            const status = document.getElementById('mic-status');
            status.className = "text-xs font-semibold px-2.5 py-0.5 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-500";
            status.innerText = "Mic Siap";
        }

        function resetMicButtons() {
            document.getElementById('btn-mic-en').className = "bg-amber-600 hover:bg-amber-700 text-white px-3 py-2 rounded shadow transition font-medium flex items-center text-sm";
            document.getElementById('mic-text-en').innerText = "Dengar Teman (EN)";
            document.getElementById('mic-icon-en').className = "fa-solid fa-ear-listen mr-2";
            document.getElementById('btn-mic-id').className = "bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded shadow transition font-medium flex items-center text-sm";
            document.getElementById('mic-text-id').innerText = "Bicara Indo (ID)";
            document.getElementById('mic-icon-id').className = "fa-solid fa-microphone-lines mr-2";
        }

        // --- PEMROSESAN TEKS ---
        async function processText(skipTranslation = false) {
            let rawText = document.getElementById('inputText').value;
            const docContent = document.getElementById('document-content');
            const colorLegend = document.getElementById('color-legend');
            const loadingIndicator = document.getElementById('loading-indicator');
            
            docContent.innerHTML = '';

            if(!rawText.trim()) {
                colorLegend.classList.add('hidden');
                return;
            }

            if (isInputIdToEnActive && !skipTranslation) {
                loadingIndicator.classList.remove('hidden');
                const translated = await translateIdToEn(rawText);
                if (translated) rawText = translated;
                loadingIndicator.classList.add('hidden');
            }

            colorLegend.classList.remove('hidden');

            const paragraphs = rawText.split('\n').filter(p => p.trim() !== '');

            paragraphs.forEach((para) => {
                const block = document.createElement('div');
                block.className = "relative group";
                
                const safeTextToSpeak = para.replace(/'/g, "\\'");
                const rawWords = para.split(/\s+/);
                let displayHTMLWords = [];
                let phoneticWords = [];

                rawWords.forEach(rawWord => {
                    const match = rawWord.match(/^([^.,?!;:()\[\]]*)([.,?!;:()\[\]]*)$/);
                    let coreWord = rawWord;
                    let punctuation = "";
                    
                    if (match) {
                        coreWord = match[1];
                        punctuation = match[2];
                    }

                    const cleanWord = coreWord.toLowerCase();
                    const dictionaryEntry = spikDictionary[cleanWord];

                    if (dictionaryEntry) {
                        phoneticWords.push(dictionaryEntry.p + punctuation);
                        let formattedWord = coreWord;
                        if (dictionaryEntry.c === "subject") {
                            formattedWord = `<span class="tag-subject" title="Subjek">${coreWord}</span>`;
                        } else if (dictionaryEntry.c === "verb") {
                            formattedWord = `<span class="tag-verb" title="Kata Kerja">${coreWord}</span>`;
                        }
                        if (dictionaryEntry.i && dictionaryEntry.i !== "") {
                            formattedWord = `<ruby>${formattedWord}<rt class="arti-indo">${dictionaryEntry.i}</rt></ruby>`;
                        }
                        displayHTMLWords.push(formattedWord + punctuation);
                    } else {
                        phoneticWords.push(cleanWord + punctuation);
                        displayHTMLWords.push(rawWord);
                    }
                });

                const finalDisplayHTML = displayHTMLWords.join(" ");
                const finalPhoneticText = "/ " + phoneticWords.join(" ") + " /";

                block.innerHTML = `
                    <div class="pr-12">
                        <p class="text-xl mb-3 text-justify text-gray-900">${finalDisplayHTML}</p>
                        <div contenteditable="true" class="phonetic-input w-full text-blue-600 font-mono text-lg bg-transparent border-b border-dashed border-gray-400 focus:outline-none focus:border-blue-500 outline-none pb-1 break-words leading-relaxed">${finalPhoneticText}</div>
                    </div>
                    <button onclick="playAudio('${safeTextToSpeak}')" class="print-hidden absolute top-0 right-0 w-10 h-10 bg-gray-100 hover:bg-primary hover:text-white rounded-full flex items-center justify-center text-gray-500 transition shadow-sm border border-gray-200 mt-2">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                `;
                docContent.appendChild(block);
            });

            const paperHeader = document.querySelector('#paper-workspace .print-hidden.border-b-2');
            if(paperHeader) paperHeader.style.display = 'none';
        }

        function playAudio(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.85; 
                window.speechSynthesis.speak(utterance);
            }
        }

        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const htmlElement = document.documentElement;
        themeToggleBtn.addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            themeIcon.className = htmlElement.classList.contains('dark') ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        });
    </script>
</body>
</html>
