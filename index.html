<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spik - Travel Companion</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3898/3898082.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: '#3b82f6' } } }
        }
    </script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        .grammar-active .tag-subject { color: #2563eb; font-weight: 700; border-bottom: 2px dotted #2563eb; transition: all 0.2s; }
        .grammar-active .tag-verb { color: #dc2626; font-weight: 700; border-bottom: 2px dotted #dc2626; transition: all 0.2s; }
        .dark .grammar-active .tag-subject { color: #60a5fa; border-bottom-color: #60a5fa; }
        .dark .grammar-active .tag-verb { color: #f87171; border-bottom-color: #f87171; }

        .phonetic-input-wrapper, .translate-wrapper { display: none; }
        .phonetic-active .phonetic-input-wrapper { display: block; }
        .translate-active .translate-wrapper { display: block; }
        
        .reply-translation { color: #d97706; font-weight: bold; font-size: 0.9em; margin-top: 0.5rem; display: block;}
        .dark .reply-translation { color: #fbbf24; }

        .logo-3d-wrapper { filter: drop-shadow(2px 2px 0px rgba(0, 0, 0, 0.15)) drop-shadow(4px 4px 3px rgba(0, 0, 0, 0.1)); display: inline-block; }
        .dark .logo-3d-wrapper { filter: drop-shadow(2px 2px 0px rgba(0, 0, 0, 0.8)) drop-shadow(4px 4px 3px rgba(0, 0, 0, 0.5)); }
        .logo-gradient-text { background: linear-gradient(45deg, #0ea5e9, #8b5cf6, #ec4899, #f43f5e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; color: transparent; }

        .text-break-safe { word-wrap: break-word; overflow-wrap: break-word; word-break: break-word; }

        /* SCROLLBAR CUSTOM UNTUK MODAL */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }

        /* PENGATURAN TAMPILAN SAAT CETAK PDF */
        .exporting-pdf .print-hidden { display: none !important; }
        .exporting-pdf #paper-workspace { padding: 20px !important; box-shadow: none !important; border: none !important; max-width: 100% !important; background-color: white !important; }
        .exporting-pdf .phonetic-input { border-bottom: none !important; color: #1d4ed8 !important; }
        .exporting-pdf .text-gray-900 { color: #000 !important; }
        .exporting-pdf .translate-wrapper { background-color: #f0fdf4 !important; border-left-color: #22c55e !important; }
        .exporting-pdf .phonetic-input-wrapper { background-color: #eff6ff !important; border-left-color: #3b82f6 !important; }
        .exporting-pdf .tok-pisin-card { background-color: #f0f9ff !important; border-color: #bae6fd !important; break-inside: avoid; }

        @media print {
            body { background-color: white !important; }
            header, #control-panel, .print-hidden, footer { display: none !important; }
            #paper-workspace { box-shadow: none !important; margin: 0 !important; padding: 0 !important; max-width: 100% !important; background-color: transparent !important; border: none !important; }
            .phonetic-input { border: none !important; color: #4b5563 !important; }
            .grammar-active .tag-subject { color: #2563eb !important; border-bottom: none !important;}
            .grammar-active .tag-verb { color: #dc2626 !important; border-bottom: none !important;}
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 dark:bg-gray-900 dark:text-gray-200 transition-colors duration-300 min-h-screen flex flex-col font-sans overflow-x-hidden">

    <header class="bg-white dark:bg-gray-800 shadow-md p-3 sm:p-4 sticky top-0 z-10 flex justify-between items-center border-b border-gray-200 dark:border-gray-700">
        <div class="logo-3d-wrapper hover:scale-105 transition-transform duration-300 cursor-default">
            <h1 class="text-2xl sm:text-3xl font-black tracking-tighter logo-gradient-text pb-1">
                <i class="fa-solid fa-plane-departure mr-1 sm:mr-2"></i>SPIK <span class="text-sm sm:text-lg font-extrabold tracking-normal opacity-90 ml-1">Travel</span>
            </h1>
        </div>
        
        <div class="flex items-center gap-2 sm:gap-3">
            <button id="install-btn" class="hidden bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded shadow transition font-medium flex items-center text-xs sm:text-sm">
                <i class="fa-solid fa-download mr-1"></i> Install
            </button>
            <button id="theme-toggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition">
                <i id="theme-icon" class="fa-solid fa-moon"></i>
            </button>
        </div>
    </header>

    <main class="flex-grow w-full max-w-6xl mx-auto p-2 sm:p-4 flex flex-col gap-4 sm:gap-6 mt-2 sm:mt-4">
        
        <div id="control-panel" class="bg-white dark:bg-gray-800 p-4 sm:p-6 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
            <div class="flex justify-between items-center mb-2 flex-wrap gap-2">
                <label class="block text-xs sm:text-sm font-semibold dark:text-gray-300">
                    <i class="fa-solid fa-comments mr-2"></i>Masukan Naskah / Teks AI:
                </label>
                
                <div class="flex items-center gap-2">
                    <input type="file" id="file-upload" class="hidden" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg" onchange="handleFileUpload(event)">
                    <button onclick="document.getElementById('file-upload').click()" class="text-xs font-semibold px-2 sm:px-3 py-1.5 rounded bg-indigo-100 dark:bg-indigo-900/50 hover:bg-indigo-200 text-indigo-700 dark:text-indigo-300 transition flex items-center shadow-sm border border-indigo-200 dark:border-indigo-700">
                        <i class="fa-solid fa-file-arrow-up mr-1"></i> Upload File
                    </button>

                    <span id="mic-status" class="text-xs font-semibold px-2 py-1.5 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-500 shadow-sm border border-gray-200 dark:border-gray-600">
                        Mic Siap
                    </span>
                </div>
            </div>

            <textarea id="inputText" rows="4" class="w-full p-3 sm:p-4 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-2 focus:ring-primary outline-none transition resize-y text-sm sm:text-base" placeholder="Ketik kalimat, paste hasil ChatGPT, atau bicara lewat mic..."></textarea>
            
            <div class="flex flex-wrap gap-2 mt-4 items-center">
                
                <!-- TOMBOL BUKU SAKU TOK PISIN ELEGAN -->
                <button onclick="openPhraseModal()" class="w-full sm:w-auto justify-center bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-600 hover:to-pink-700 text-white px-4 py-2 rounded shadow-md transition font-bold flex items-center text-xs sm:text-sm hover:scale-105 duration-200 transform">
                    <i class="fa-solid fa-book-atlas mr-2"></i> Kamus Tok Pisin (PNG)
                </button>

                <div class="w-full h-px bg-gray-200 dark:bg-gray-700 my-1 sm:hidden"></div>

                <button id="btn-mic-en" onclick="toggleListening('en-US')" class="flex-1 sm:flex-none justify-center bg-amber-600 hover:bg-amber-700 text-white px-3 py-2 rounded shadow transition font-medium flex items-center text-xs sm:text-sm">
                    <i id="mic-icon-en" class="fa-solid fa-ear-listen mr-1 sm:mr-2"></i> <span id="mic-text-en">Dengar (EN)</span>
                </button>
                <button id="btn-mic-id" onclick="toggleListening('id-ID')" class="flex-1 sm:flex-none justify-center bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded shadow transition font-medium flex items-center text-xs sm:text-sm">
                    <i id="mic-icon-id" class="fa-solid fa-microphone-lines mr-1 sm:mr-2"></i> <span id="mic-text-id">Bicara (ID)</span>
                </button>

                <div class="w-full h-px bg-gray-200 dark:bg-gray-700 my-1 sm:hidden"></div>

                <button id="btn-input-translate" onclick="toggleInputTranslation()" class="bg-gray-500 hover:bg-gray-600 text-white px-3 py-2 rounded shadow transition font-medium flex items-center text-xs sm:text-sm" title="Ubah Ketikan Indo ke Inggris">
                    <i id="input-translate-icon" class="fa-solid fa-arrow-right-arrow-left mr-1 sm:mr-2"></i> <span id="input-translate-text">Ketik Indo (OFF)</span>
                </button>

                <button onclick="processText()" class="bg-primary text-white px-4 py-2 rounded shadow hover:bg-blue-600 transition font-medium flex items-center text-xs sm:text-sm">
                    <i class="fa-solid fa-wand-magic-sparkles mr-1 sm:mr-2"></i> Buat Naskah AI
                </button>
                
                <button onclick="clearText()" class="bg-gray-500 text-white px-3 py-2 rounded shadow hover:bg-gray-600 transition font-medium flex items-center text-xs sm:text-sm">
                    <i class="fa-solid fa-trash-can mr-1 sm:mr-2"></i> Bersihkan
                </button>

                <div class="w-full h-px bg-gray-200 dark:bg-gray-700 my-1 sm:hidden"></div>
                
                <div class="flex flex-wrap gap-2 print-hidden w-full sm:w-auto mt-2 sm:mt-0 items-center">
                    <button id="btn-grammar" onclick="toggleGrammar()" class="flex-1 sm:flex-none justify-center bg-purple-600 text-white px-2 py-2 rounded shadow transition font-medium flex items-center text-xs">
                        <i id="grammar-icon" class="fa-solid fa-eye mr-1"></i> <span id="grammar-text">Pola (ON)</span>
                    </button>
                    <button id="btn-translate" onclick="toggleTranslate()" class="flex-1 sm:flex-none justify-center bg-teal-600 text-white px-2 py-2 rounded shadow transition font-medium flex items-center text-xs">
                        <i id="translate-icon" class="fa-solid fa-language mr-1"></i> <span id="translate-text">Arti (ON)</span>
                    </button>
                    <button id="btn-phonetic" onclick="togglePhonetic()" class="flex-1 sm:flex-none justify-center bg-sky-600 text-white px-2 py-2 rounded shadow transition font-medium flex items-center text-xs">
                        <i id="phonetic-icon" class="fa-solid fa-comment-dots mr-1"></i> <span id="phonetic-text">Bacaan (ON)</span>
                    </button>

                    <div class="w-px h-6 bg-gray-300 dark:bg-gray-600 mx-1 hidden sm:block"></div>
                    <button onclick="downloadPDF()" class="flex-1 sm:flex-none justify-center bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded shadow transition font-medium flex items-center text-xs sm:text-sm">
                        <i class="fa-solid fa-file-pdf mr-1 sm:mr-2"></i> Unduh PDF
                    </button>
                </div>
            </div>
            
            <div id="loading-indicator" class="hidden mt-4 text-xs sm:text-sm text-blue-600 font-bold flex items-center">
                <i class="fa-solid fa-microchip fa-spin mr-2"></i> <span id="loading-text">Mempersiapkan area kerja...</span>
            </div>
        </div>

        <div class="w-full pb-8">
            <div id="paper-workspace" class="grammar-active translate-active phonetic-active mx-auto p-4 sm:p-8 md:p-12 w-full max-w-[21cm] transition-none relative overflow-hidden bg-transparent">
                
                <div id="color-legend" class="hidden mb-6 bg-white dark:bg-gray-800 p-3 rounded-lg shadow-sm text-xs sm:text-sm print-hidden flex flex-wrap gap-2 sm:gap-4 justify-between items-center border border-gray-200 dark:border-gray-700">
                    <div><strong>Petunjuk Grammar:</strong> <span class="text-blue-600 font-bold ml-1 border-b-2 border-dotted border-blue-600">Biru = Subjek</span> | <span class="text-red-600 font-bold border-b-2 border-dotted border-red-600">Merah = Kata Kerja</span></div>
                </div>

                <div id="document-content" class="space-y-6"></div>
            </div>
        </div>
    </main>

    <!-- MODAL KAMUS TOK PISIN -->
    <div id="phrase-modal" class="fixed inset-0 bg-black/70 z-[100] hidden flex justify-center items-center backdrop-blur-sm p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white dark:bg-gray-900 w-full max-w-2xl rounded-2xl shadow-2xl flex flex-col max-h-[90vh] overflow-hidden transform scale-95 transition-transform duration-300" id="phrase-modal-content">
            
            <!-- Header Modal -->
            <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-4 sm:p-5 flex justify-between items-center">
                <h2 class="text-white font-bold text-lg sm:text-xl flex items-center">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e3/Flag_of_Papua_New_Guinea.svg/320px-Flag_of_Papua_New_Guinea.svg.png" class="w-6 h-4 mr-2 rounded-sm" alt="PNG Flag"> 
                    Buku Saku Tok Pisin
                </h2>
                <button onclick="closePhraseModal()" class="text-white hover:text-red-200 transition p-1 bg-white/20 rounded-full w-8 h-8 flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Tab Navigasi Kategori -->
            <div class="flex overflow-x-auto p-2 bg-gray-50 dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 space-x-2" id="phrase-tabs">
                <!-- Tabs akan di-render dari JS -->
            </div>

            <!-- Daftar Kosakata -->
            <div class="overflow-y-auto p-4 sm:p-6 bg-gray-100 dark:bg-gray-900 flex-grow" id="phrase-list">
                <!-- Kartu kosakata akan di-render dari JS -->
            </div>

        </div>
    </div>

    <footer class="text-center p-4 text-xs sm:text-sm text-gray-500 dark:text-gray-400 mt-auto font-medium print-hidden flex flex-col sm:flex-row justify-center items-center gap-3">
        <span>&copy; 2026 Spik. Travel Edition.</span>
        <button onclick="forceHardReset()" class="text-xs bg-red-100 text-red-600 hover:bg-red-200 px-3 py-1.5 rounded-full font-bold transition shadow-sm border border-red-200">
            <i class="fa-solid fa-rotate-right mr-1"></i> Refresh Sistem
        </button>
    </footer>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        // --- DATABASE TOK PISIN (TERLENGKAP UNTUK TRAVEL & DAKWAH) ---
        const tokPisinData = {
            "Sapaan": [
                { id: "Halo / Selamat Pagi", tp: "Moning", en: "Good morning" },
                { id: "Selamat Sore", tp: "Apinun", en: "Good afternoon" },
                { id: "Selamat Malam", tp: "Gudnait", en: "Good night" },
                { id: "Apa kabar?", tp: "Yu orait?", en: "How are you?" },
                { id: "Saya baik-baik saja", tp: "Mi orait tasol", en: "I am fine" },
                { id: "Terima kasih banyak", tp: "Tenkyu tru", en: "Thank you very much" },
                { id: "Sama-sama", tp: "I orait / Nogat samting", en: "You are welcome" },
                { id: "Permisi / Maaf", tp: "Skius / Sori", en: "Excuse me / Sorry" },
                { id: "Sampai jumpa nanti", tp: "Lukim yu bihain", en: "See you later" }
            ],
            "Percakapan": [
                { id: "Ya", tp: "Yes", en: "Yes" },
                { id: "Tidak", tp: "Nogat", en: "No" },
                { id: "Siapa nama Anda?", tp: "Wanem nem bilong yu?", en: "What is your name?" },
                { id: "Nama saya...", tp: "Nem bilong mi...", en: "My name is..." },
                { id: "Saya tidak mengerti", tp: "Mi no klia / Mi no save", en: "I do not understand" },
                { id: "Tolong bicara pelan-pelan", tp: "Tok isi isi plis", en: "Please speak slowly" },
                { id: "Apakah Anda bisa bahasa Inggris?", tp: "Yu save long Tok Inglis?", en: "Do you speak English?" },
                { id: "Saya dari Indonesia", tp: "Mi kam long Indonesia", en: "I am from Indonesia" }
            ],
            "Arah & Jalan": [
                { id: "Di mana toilet?", tp: "Toilet i stap we?", en: "Where is the toilet?" },
                { id: "Saya mau pergi ke...", tp: "Mi laik go long...", en: "I want to go to..." },
                { id: "Tolong antar saya ke bandara", tp: "Kisim mi go long epot plis", en: "Please take me to the airport" },
                { id: "Berhenti di sini", tp: "Stop hia", en: "Stop here" },
                { id: "Jauh kah?", tp: "Em longwe o nogat?", en: "Is it far?" },
                { id: "Lurus saja", tp: "Go stret", en: "Go straight" }
            ],
            "Belanja": [
                { id: "Berapa harganya?", tp: "Em hamas?", en: "How much does this cost?" },
                { id: "Ini terlalu mahal", tp: "Em i dia tumas", en: "It is too expensive" },
                { id: "Apakah ada air minum?", tp: "I gat wara bilong dring?", en: "Is there drinking water?" },
                { id: "Saya mau beli makanan", tp: "Mi laik baim kaikai", en: "I want to buy food" },
                { id: "Tolong tuliskan harganya", tp: "Raitim prais hia plis", en: "Please write the price" }
            ],
            "Darurat": [
                { id: "Tolong saya!", tp: "Helpim mi!", en: "Help me!" },
                { id: "Saya butuh dokter", tp: "Mi mas lukim dokta", en: "I need a doctor" },
                { id: "Di mana rumah sakit?", tp: "Haus sik i stap we?", en: "Where is the hospital?" },
                { id: "Panggil polisi!", tp: "Singautim polis!", en: "Call the police!" },
                { id: "Saya tersesat", tp: "Mi lusim rot", en: "I am lost" }
            ],
            "Dakwah": [
                { id: "Di mana Masjid?", tp: "Haus lotu (Mosque) i stap we?", en: "Where is the Mosque?" },
                { id: "Kami datang untuk silaturahmi", tp: "Mipela kam bilong bungim yupela", en: "We come to visit you" },
                { id: "Allah Maha Besar", tp: "Allah em i bikpela tru", en: "Allah is the Greatest" },
                { id: "Mari kita shalat", tp: "Yumi go beten", en: "Let us pray" },
                { id: "Semoga Tuhan memberkati Anda", tp: "God i blesim yu", en: "May God bless you" },
                { id: "Satu Tuhan, Allah", tp: "Wanpela God tasol, Allah", en: "Only one God, Allah" }
            ]
        };

        // --- FUNGSI MODAL TOK PISIN ---
        let currentCategory = "Sapaan";

        function openPhraseModal() {
            const modal = document.getElementById('phrase-modal');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); document.getElementById('phrase-modal-content').classList.remove('scale-95'); }, 10);
            renderTabs();
            renderPhrases();
        }

        function closePhraseModal() {
            const modal = document.getElementById('phrase-modal');
            modal.classList.add('opacity-0');
            document.getElementById('phrase-modal-content').classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('phrase-tabs');
            tabsContainer.innerHTML = '';
            Object.keys(tokPisinData).forEach(cat => {
                const isActive = cat === currentCategory;
                const btn = document.createElement('button');
                btn.className = `whitespace-nowrap px-4 py-2 rounded-full text-sm font-bold transition-colors ${isActive ? 'bg-blue-600 text-white shadow' : 'bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-600'}`;
                btn.innerText = cat;
                btn.onclick = () => { currentCategory = cat; renderTabs(); renderPhrases(); };
                tabsContainer.appendChild(btn);
            });
        }

        function renderPhrases() {
            const listContainer = document.getElementById('phrase-list');
            listContainer.innerHTML = '';
            tokPisinData[currentCategory].forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 mb-3 flex flex-col sm:flex-row justify-between sm:items-center gap-4 hover:border-blue-300 transition-colors";
                card.innerHTML = `
                    <div class="flex-grow">
                        <p class="text-xs text-gray-500 dark:text-gray-400 font-bold uppercase tracking-wider mb-1">${item.id}</p>
                        <p class="text-xl font-black text-blue-600 dark:text-blue-400 leading-tight">${item.tp}</p>
                        <p class="text-sm text-gray-600 dark:text-gray-300 italic mt-1 font-serif">English: ${item.en}</p>
                    </div>
                    <button onclick="insertTokPisin('${item.tp}', '${item.en}', '${item.id}')" class="bg-blue-100 hover:bg-blue-200 text-blue-700 px-4 py-2 rounded-lg font-bold text-sm transition flex items-center justify-center whitespace-nowrap">
                        <i class="fa-solid fa-share-from-square mr-2"></i> Gunakan
                    </button>
                `;
                listContainer.appendChild(card);
            });
        }

        // Fungsi khusus menyisipkan format Rahasia Tok Pisin ke Naskah
        function insertTokPisin(tp, en, id) {
            const textArea = document.getElementById('inputText');
            // Format khusus agar dibaca oleh Regex di processText
            const magicText = `[Tok Pisin] ${tp} / [English] ${en} <Terjemahan: ${id}>`;
            
            if (textArea.value.trim() === '') { textArea.value = magicText; }
            else { textArea.value += '\n\n' + magicText; }
            
            closePhraseModal();
            processText(true); // Langsung proses tanpa terjemahan ulang
        }

        // --- KAMUS SCHWA SPIK ---
        const spikDictionary = {
            "i": { p: "ai", c: "subject" }, "you": { p: "yuu", c: "subject" }, "they": { p: "dhei", c: "subject" }, 
            "we": { p: "wii", c: "subject" }, "he": { p: "hii", c: "subject" }, "she": { p: "shii", c: "subject" }, 
            "it": { p: "it", c: "subject" }, "us": { p: "əs", c: "subject" }, "me": { p: "mii", c: "" }, 
            "him": { p: "him", c: "" }, "them": { p: "dhem", c: "" }, "my": { p: "mai", c: "" }, 
            "your": { p: "yor", c: "" }, "our": { p: "awr", c: "" }, "ourselves": { p: "awr-selvz", c: "" },
            "am": { p: "em", c: "verb" }, "is": { p: "iz", c: "verb" }, "are": { p: "aar", c: "verb" }, 
            "was": { p: "wəz", c: "verb" }, "were": { p: "wər", c: "verb" }, "do": { p: "duu", c: "verb" }, 
            "did": { p: "did", c: "verb" }, "have": { p: "hæv", c: "verb" }, "has": { p: "hæz", c: "verb" }, 
            "had": { p: "hæd", c: "verb" }, "can": { p: "kæn", c: "verb" }, "could": { p: "kud", c: "verb" },

        // --- FUNGSI UNDUH PDF ---
        function downloadPDF() {
            const element = document.getElementById('paper-workspace');
            const opt = {
                margin:       10,
                filename:     'Spik_Travel_Naskah.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            document.body.classList.add('exporting-pdf');
            setTimeout(() => {
                html2pdf().set(opt).from(element).save().then(() => {
                    document.body.classList.remove('exporting-pdf');
                });
            }, 100);
        }

        function forceHardReset() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                    for(let registration of registrations) { registration.unregister(); }
                });
            }
            caches.keys().then(function(names) {
                for (let name of names) caches.delete(name);
            });
            alert('Sistem sedang di-reset. Mohon tunggu...');
            window.location.href = window.location.pathname + '?v=' + new Date().getTime();
        }

        function clearText() {
            document.getElementById('inputText').value = '';
            document.getElementById('document-content').innerHTML = '';
            document.getElementById('color-legend').classList.add('hidden');
            document.getElementById('loading-indicator').classList.add('hidden');
        }

        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const loadingIndicator = document.getElementById('loading-indicator');
            const loadingText = document.getElementById('loading-text');
            const textArea = document.getElementById('inputText');
            
            loadingText.innerText = `Sedang mengekstrak teks dari file ${file.name}...`;
            loadingIndicator.classList.remove('hidden');

            try {
                let extractedText = '';
                const fileType = file.name.split('.').pop().toLowerCase();

                if (fileType === 'pdf') {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                    let fullText = '';
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        fullText += textContent.items.map(item => item.str).join(' ') + '\n';
                    }
                    extractedText = fullText;
                } else if (fileType === 'doc' || fileType === 'docx') {
                    const arrayBuffer = await file.arrayBuffer();
                    const result = await mammoth.extractRawText({arrayBuffer: arrayBuffer});
                    extractedText = result.value;
                } else if (['png', 'jpg', 'jpeg'].includes(fileType)) {
                    const result = await Tesseract.recognize(file, 'eng+ind');
                    extractedText = result.data.text;
                }

                if (extractedText.trim() !== '') {
                    if (textArea.value.trim() !== '') textArea.value += '\n\n';
                    textArea.value += extractedText.trim();
                } else {
                    alert('Gagal menemukan teks.');
                }
            } catch (error) {
                alert('Gagal membaca file.');
            } finally {
                loadingIndicator.classList.add('hidden');
                event.target.value = ''; 
            }
        }

        async function translateAPI(text, sourceLang, targetLang) {
            if (!text || text.trim() === "") return "";
            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
                const response = await fetch(url);
                const data = await response.json();
                let translatedResult = '';
                if(data && data[0]) {
                    data[0].forEach(item => { if(item[0]) translatedResult += item[0]; });
                }
                return translatedResult || text;
            } catch (error) { return text; }
        }

        let recognition = null;
        let isListening = false;
        let currentMicMode = '';
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = async (event) => {
                let currentSpeech = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    currentSpeech += event.results[i][0].transcript;
                }
                const textArea = document.getElementById('inputText');
                
                if (currentMicMode === 'id-ID') {
                    const translatedSpeech = await translateAPI(currentSpeech, 'id', 'en');
                    currentSpeech = translatedSpeech;
                } 
                else if (currentMicMode === 'en-US') {
                    const artiIndo = await translateAPI(currentSpeech, 'en', 'id');
                    if(artiIndo !== currentSpeech && artiIndo !== "") {
                        currentSpeech = currentSpeech + "\n<Terjemahan: " + artiIndo + ">";
                    }
                }

                if (textArea.value.trim() === '') { textArea.value = currentSpeech.trim(); } 
                else { textArea.value += '\n\n' + currentSpeech.trim(); }
                processText(true); 
            };
            recognition.onend = () => { if (isListening) recognition.start(); };
        }

        function toggleListening(langCode) {
            if (!recognition) return alert("Browser tidak support.");
            if (isListening) {
                if (currentMicMode === langCode) { stopListening(); } 
                else { stopListening(); setTimeout(() => startListening(langCode), 500); }
            } else { startListening(langCode); }
        }

        function startListening(langCode) {
            isListening = true; currentMicMode = langCode; recognition.lang = langCode; recognition.start();
            resetMicButtons();
            const status = document.getElementById('mic-status');
            if (langCode === 'en-US') {
                document.getElementById('btn-mic-en').className = "flex-1 sm:flex-none justify-center bg-red-600 text-white px-3 py-2 rounded shadow transition font-medium flex items-center text-xs sm:text-sm animate-pulse";
                document.getElementById('mic-text-en').innerText = "Stop Dengar";
                status.innerText = "Mendengar Bule...";
            } else {
                document.getElementById('btn-mic-id').className = "flex-1 sm:flex-none justify-center bg-red-600 text-white px-3 py-2 rounded shadow transition font-medium flex items-center text-xs sm:text-sm animate-pulse";
                document.getElementById('mic-text-id').innerText = "Stop Bicara";
                status.innerText = "Merekam Suara...";
            }
            status.className = "text-xs font-semibold px-2.5 py-0.5 rounded-full bg-red-100 text-red-700 shadow-sm";
        }

        function stopListening() {
            isListening = false; currentMicMode = ''; if (recognition) recognition.stop();
            resetMicButtons();
            document.getElementById('mic-status').innerText = "Mic Siap";
            document.getElementById('mic-status').className = "text-xs font-semibold px-2.5 py-1.5 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-500 shadow-sm";
        }

        function resetMicButtons() {
            document.getElementById('btn-mic-en').className = "flex-1 sm:flex-none justify-center bg-amber-600 hover:bg-amber-700 text-white px-3 py-2 rounded shadow transition font-medium flex items-center text-xs sm:text-sm";
            document.getElementById('mic-text-en').innerText = "Dengar (EN)";
            document.getElementById('btn-mic-id').className = "flex-1 sm:flex-none justify-center bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded shadow transition font-medium flex items-center text-xs sm:text-sm";
            document.getElementById('mic-text-id').innerText = "Bicara (ID)";
        }

        async function processText(skipTranslation = false) {
            let rawText = document.getElementById('inputText').value;
            const docContent = document.getElementById('document-content');
            const colorLegend = document.getElementById('color-legend');
            const loadingIndicator = document.getElementById('loading-indicator');
            const loadingText = document.getElementById('loading-text');
            
            docContent.innerHTML = '';
            if(!rawText.trim()) { colorLegend.classList.add('hidden'); return; }

            try {
                loadingIndicator.classList.remove('hidden'); 
                colorLegend.classList.remove('hidden');

                if (isInputIdToEnActive && !skipTranslation) {
                    loadingText.innerText = "Menerjemahkan Indo ke Inggris...";
                    let paragraphsToTranslate = rawText.split(/\n+/).filter(p => p.trim() !== '');
                    let translatedParts = [];
                    for (let p of paragraphsToTranslate) {
                        let res = await translateAPI(p, 'id', 'en');
                        translatedParts.push(res);
                    }
                    rawText = translatedParts.join('\n\n');
                }

                loadingIndicator.classList.add('hidden');
                const paragraphs = rawText.split(/\n+/).filter(p => p.trim() !== '');
                let partCounter = 1;

                for (const para of paragraphs) {
                    const sentences = para.match(/[^.?!;]+[.?!;]+(?:\s|$)\vert{}[^.?!;]+$/g) || [para];

                    for (const sentence of sentences) {
                        const trimmedSentence = sentence.trim();
                        if(!trimmedSentence) continue;

                        const block = document.createElement('div');
                        block.className = "relative group bg-white dark:bg-gray-800 rounded-xl p-5 sm:p-6 shadow-sm border border-gray-200 dark:border-gray-700 break-words mb-6"; 
                        
                        // DETEKSI KARTU KHUSUS TOK PISIN
                        const tpMatch = trimmedSentence.match(/\[Tok Pisin\](.*?)\[English\](.*?)<Terjemahan:\s*(.*?)>/i);
                        if(tpMatch) {
                            const tpText = tpMatch[1].replace('/', '').trim();
                            const enText = tpMatch[2].trim();
                            const idText = tpMatch[3].trim();
                            
                            block.className = "tok-pisin-card relative group bg-gradient-to-br from-blue-50 to-indigo-50 dark:from-blue-900/20 dark:to-indigo-900/20 rounded-xl p-5 sm:p-6 shadow-sm border border-blue-200 dark:border-blue-800 break-words mb-6";
                            block.innerHTML = `
                                <div class="pr-12">
                                    <span class="bg-blue-600 text-white text-[10px] sm:text-xs font-bold px-2 py-1 rounded uppercase tracking-wider print-hidden"><i class="fa-solid fa-bolt mr-1"></i> Tok Pisin Instan</span>
                                    <p class="text-sm text-gray-500 dark:text-gray-400 font-bold uppercase tracking-wider mt-3 mb-1">${idText}</p>
                                    <p class="text-2xl sm:text-3xl font-black text-blue-700 dark:text-blue-400 leading-tight">${tpText}</p>
                                    <p class="text-sm sm:text-base text-gray-600 dark:text-gray-300 italic mt-2 font-serif border-t border-blue-200 dark:border-blue-700/50 pt-2">English: ${enText}</p>
                                </div>
                            `;
                            docContent.appendChild(block);
                            continue; 
                        }

                        // DETEKSI TERJEMAHAN DARI BULE
                        const translationMatch = trimmedSentence.match(/<Terjemahan:\s*(.*?)>/);
                        if(translationMatch) {
                            block.innerHTML = `<div class="bg-amber-50 dark:bg-amber-900/30 p-4 rounded-lg border-l-4 border-amber-500"><p class="text-amber-800 dark:text-amber-300 font-bold"><i class="fa-solid fa-language mr-2"></i>Orang itu bilang: "${translationMatch[1]}"</p></div>`;
                            docContent.appendChild(block);
                            continue; 
                        }

                        const safeTextToSpeak = trimmedSentence.replace(/'/g, "\\'");
                        const rawWords = trimmedSentence.split(/\s+/);
                        let displayHTMLWords = [];
                        let phoneticWords = [];

                        rawWords.forEach(rawWord => {
                            const match = rawWord.match(/^([^.,?!;:()\[\]"']*)([.,?!;:()\[\]"']*)$/);
                            let coreWord = match ? match[1] : rawWord;
                            let punctuation = match ? match[2] : "";

                            const cleanWord = coreWord.toLowerCase();
                            const dictionaryEntry = spikDictionary[cleanWord];

                            if (dictionaryEntry) {
                                phoneticWords.push(dictionaryEntry.p + punctuation);
                                let formattedWord = coreWord;
                                if (dictionaryEntry.c === "subject") formattedWord = `<span class="tag-subject" title="Subjek">${coreWord}</span>`;
                                else if (dictionaryEntry.c === "verb") formattedWord = `<span class="tag-verb" title="Kata Kerja">${coreWord}</span>`;
                                
                                displayHTMLWords.push(formattedWord + punctuation);
                            } else {
                                phoneticWords.push(cleanWord + punctuation);
                                displayHTMLWords.push(rawWord);
                            }
                        });

                        const finalDisplayHTML = displayHTMLWords.join(" ");
                        const finalPhoneticText = "/ " + phoneticWords.join(" ") + " /";
                        const transId = 'trans-' + Date.now() + '-' + Math.floor(Math.random() * 1000);

                        block.innerHTML = `
                            <div class="pr-12 text-break-safe space-y-4">
                                <div>
                                    <span class="text-[10px] sm:text-xs text-blue-500 font-bold mb-1 block print-hidden"><i class="fa-solid fa-list-ol mr-1"></i> Potongan ${partCounter}</span>
                                    <p class="text-xl sm:text-2xl font-serif text-gray-900 dark:text-gray-100 leading-relaxed">${finalDisplayHTML}</p>
                                </div>

                                <div class="phonetic-input-wrapper bg-blue-50 dark:bg-blue-900/20 p-3 rounded border-l-4 border-blue-500 mt-2">
                                    <span class="text-xs text-blue-600 dark:text-blue-400 font-bold uppercase tracking-wider mb-1 block print-hidden"><i class="fa-solid fa-comment-dots mr-1"></i>Cara Baca</span>
                                    <div contenteditable="true" class="phonetic-input w-full text-blue-700 dark:text-blue-300 font-mono text-base sm:text-lg bg-transparent focus:outline-none outline-none text-break-safe leading-relaxed">${finalPhoneticText}</div>
                                </div>
                                
                                <div class="translate-wrapper bg-green-50 dark:bg-green-900/20 p-3 rounded border-l-4 border-green-500 mt-2">
                                    <span class="text-xs text-green-600 dark:text-green-400 font-bold uppercase tracking-wider mb-1 block print-hidden"><i class="fa-solid fa-language mr-1"></i>Arti Kalimat</span>
                                    <p id="${transId}" class="text-base sm:text-lg text-green-800 dark:text-green-300 leading-relaxed"><i class="fa-solid fa-spinner fa-spin mr-1 print-hidden"></i> Menyusun arti...</p>
                                </div>
                            </div>

                            <button onclick="playAudio('${safeTextToSpeak}')" class="print-hidden absolute top-4 right-4 w-10 h-10 bg-gray-100 dark:bg-gray-700 hover:bg-primary hover:text-white rounded-full flex items-center justify-center text-gray-500 dark:text-gray-300 transition shadow-sm border border-gray-200 dark:border-gray-600">
                                <i class="fa-solid fa-volume-high text-sm sm:text-base"></i>
                            </button>
                        `;
                        docContent.appendChild(block);
                        partCounter++;

                        if (navigator.onLine) {
                            translateAPI(trimmedSentence, 'en', 'id').then(res => {
                                const el = document.getElementById(transId);
                                if(el) el.innerHTML = res;
                            });
                        } else {
                            const el = document.getElementById(transId);
                            if(el) el.innerText = "📶 Offline. Terjemahan utuh tidak tersedia karena tidak ada sinyal internet.";
                        }
                    }
                }
            } catch (err) {
                console.error("Proses teks macet:", err);
            } finally {
                loadingIndicator.classList.add('hidden');
            }
        }

        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const htmlElement = document.documentElement;
        themeToggleBtn.addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            themeIcon.className = htmlElement.classList.contains('dark') ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        });

        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => { reg.update(); }).catch(err => console.log('PWA Error.'));
            });
        }
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); deferredPrompt = e; installBtn.classList.remove('hidden');
        });
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt(); await deferredPrompt.userChoice;
                deferredPrompt = null; installBtn.classList.add('hidden');
            }
        });
    </script>
