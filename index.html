<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spik - Mode Dialog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        subject: '#2563eb',
                        verb: '#dc2626',
                        chatA: '#f3f4f6', /* Abu-abu terang untuk Orang A */
                        chatB: '#eff6ff', /* Biru sangat terang untuk Orang B */
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-200 transition-colors duration-300 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-white dark:bg-gray-800 shadow-md p-4 sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-2xl font-black text-primary tracking-tighter"><i class="fa-solid fa-microphone-lines mr-2"></i>SPIK <span class="text-sm font-normal text-gray-500 dark:text-gray-400">Dialog</span></h1>
        <div class="flex gap-4">
            <button onclick="playFullConversation()" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg font-bold shadow-md transition flex items-center">
                <i class="fa-solid fa-play mr-2"></i> Putar Semua
            </button>
            <button id="theme-toggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition">
                <i id="theme-icon" class="fa-solid fa-moon"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow w-full max-w-3xl mx-auto p-4 flex flex-col gap-6 mt-4 pb-12">
        
        <div class="bg-blue-50 dark:bg-blue-900/30 border-l-4 border-primary p-4 rounded-r-lg space-y-2 mb-4">
            <p class="text-sm font-medium">Cara Berlatih Listening:</p>
            <ul class="text-sm list-disc list-inside space-y-1">
                <li>Klik "Putar Semua" untuk mendengar percakapan utuh.</li>
                <li>Fokus murni pada teks Inggris dan suara. Tebak konteksnya dari alur percakapan tanpa melihat kamus terjemahan.</li>
            </ul>
        </div>

        <!-- Area Chat Container -->
        <div id="chat-container" class="flex flex-col space-y-6">
            <!-- Chat Bubbles akan di-render di sini oleh JavaScript -->
        </div>

    </main>

    <script>
        // Data Percakapan
        // speaker: 'A' (Kiri) atau 'B' (Kanan)
        const dialogData = [
            {
                id: 1,
                speaker: 'A',
                htmlText: "Excuse me, <span class='text-subject font-bold'>I</span> <span class='text-verb font-bold'>am looking</span> for the library.",
                pureText: "Excuse me, I am looking for the library.",
                phonetic: "/ Ekskyus mi, ai em luking for de laibreri /"
            },
            {
                id: 2,
                speaker: 'B',
                htmlText: "<span class='text-subject font-bold'>It</span> <span class='text-verb font-bold'>is</span> on the second floor. <span class='text-subject font-bold'>You</span> <span class='text-verb font-bold'>can take</span> the stairs.",
                pureText: "It is on the second floor. You can take the stairs.",
                phonetic: "/ It is on de sekend flor. Yu ken teik de steers /"
            },
            {
                id: 3,
                speaker: 'A',
                htmlText: "<span class='text-verb font-bold'>Thank</span> you. <span class='text-subject font-bold'>I</span> <span class='text-verb font-bold'>appreciate</span> your help.",
                pureText: "Thank you. I appreciate your help.",
                phonetic: "/ Theng kyu. Ai apriesyeit yor help /"
            }
        ];

        const chatContainer = document.getElementById('chat-container');

        // Fungsi me-render UI layaknya aplikasi chatting
        function renderDialog() {
            dialogData.forEach((line) => {
                const bubbleWrapper = document.createElement('div');
                const isSpeakerA = line.speaker === 'A';
                
                // Mengatur posisi kiri (A) atau kanan (B)
                bubbleWrapper.className = `flex w-full ${isSpeakerA ? 'justify-start' : 'justify-end'}`;
                
                const bubbleColor = isSpeakerA 
                    ? 'bg-chatA dark:bg-gray-700 border-gray-200 dark:border-gray-600' 
                    : 'bg-chatB dark:bg-blue-900/40 border-blue-100 dark:border-blue-800';

                bubbleWrapper.innerHTML = `
                    <div class="max-w-[85%] md:max-w-[70%] border rounded-2xl p-5 shadow-sm relative group ${bubbleColor} ${isSpeakerA ? 'rounded-tl-none' : 'rounded-tr-none'}">
                        
                        <div class="flex justify-between items-start gap-4">
                            <div>
                                <p class="text-xl font-medium text-gray-900 dark:text-gray-100 mb-2 leading-relaxed">
                                    ${line.htmlText}
                                </p>
                                <p class="text-base text-primary font-mono bg-white/60 dark:bg-gray-800/60 inline-block px-2 py-1 rounded">
                                    ${line.phonetic}
                                </p>
                            </div>
                            
                            <!-- Tombol Play Individual -->
                            <button onclick="playSingleVoice('${line.pureText}', '${line.speaker}')" class="flex-shrink-0 w-10 h-10 bg-white dark:bg-gray-600 hover:bg-primary hover:text-white rounded-full flex items-center justify-center text-gray-500 transition shadow">
                                <i class="fa-solid fa-volume-high"></i>
                            </button>
                        </div>
                    </div>
                `;
                chatContainer.appendChild(bubbleWrapper);
            });
        }

        // Fungsi Memutar Suara Individual dengan modifikasi pitch untuk membedakan orang
        function playSingleVoice(text, speakerID) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.85; // Sedikit diperlambat agar jelas
                
                // Trik membedakan suara jika browser hanya punya 1 jenis suara default
                if (speakerID === 'A') {
                    utterance.pitch = 1.2; // Suara sedikit lebih tinggi
                } else {
                    utterance.pitch = 0.8; // Suara sedikit lebih rendah/berat
                }
                
                window.speechSynthesis.speak(utterance);
            }
        }

        // Fungsi Memutar Seluruh Percakapan Secara Berurutan
        function playFullConversation() {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            let currentIndex = 0;

            function speakNext() {
                if (currentIndex < dialogData.length) {
                    const line = dialogData[currentIndex];
                    const utterance = new SpeechSynthesisUtterance(line.pureText);
                    utterance.lang = 'en-US';
                    utterance.rate = 0.85;
                    utterance.pitch = (line.speaker === 'A') ? 1.2 : 0.8;

                    // Event listener: Saat kalimat ini selesai dibaca, lanjut ke kalimat berikutnya
                    utterance.onend = () => {
                        currentIndex++;
                        setTimeout(speakNext, 500); // Jeda setengah detik antar pembicara
                    };

                    window.speechSynthesis.speak(utterance);
                }
            }
            speakNext();
        }

        // Toggle Dark Mode
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const htmlElement = document.documentElement;

        themeToggleBtn.addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            if (htmlElement.classList.contains('dark')) {
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
            } else {
                themeIcon.classList.remove('fa-sun');
                themeIcon.classList.add('fa-moon');
            }
        });

        // Inisialisasi
        renderDialog();
    </script>
</body>
</html>
